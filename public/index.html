<html lang="fr"><head>

<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout : bandeau d'en-tête aux couleurs du flyer, onglets collants, contenu en cartes sobres ; jour J en 2 colonnes (familles | élèves) */
:root{
  --paper:#faf7fb; --card:#ffffff; --sunk:#f3eef6; --ink:#1d1530; --muted:#6a6180; --line:#e5dcec;
  --accent:#c4206f; --accent-ink:#ffffff; --violet:#6b3fd1; --sun:#ef8a1d;
  --ok:#1d8656; --ok-bg:#e3f4ec; --warn:#a86400; --warn-bg:#fdf0dc; --bad:#c23a3a; --bad-bg:#fbe5e5; --info-bg:#efe8fd;
  --f-display:"League Spartan","Avenir Next","Century Gothic",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14101b; --card:#1d1726; --sunk:#251d31; --ink:#f2edf8; --muted:#a69cb8; --line:#352b43;
  --accent:#ff5fa9; --accent-ink:#1a0b14; --violet:#a98cff; --sun:#ffa94d;
  --ok:#5fd39b; --ok-bg:#163428; --warn:#ffbf5e; --warn-bg:#3a2a10; --bad:#ff8080; --bad-bg:#3d1c1f; --info-bg:#2a2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14101b; --card:#1d1726; --sunk:#251d31; --ink:#f2edf8; --muted:#a69cb8; --line:#352b43;
  --accent:#ff5fa9; --accent-ink:#1a0b14; --violet:#a98cff; --sun:#ffa94d;
  --ok:#5fd39b; --ok-bg:#163428; --warn:#ffbf5e; --warn-bg:#3a2a10; --bad:#ff8080; --bad-bg:#3d1c1f; --info-bg:#2a2140; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:linear-gradient(100deg,var(--card) 55%,color-mix(in srgb,var(--accent) 14%,var(--card)) 80%,color-mix(in srgb,var(--violet) 22%,var(--card)));border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand .mark{border:3px solid var(--ink);padding:4px 8px 2px;font-family:var(--f-display);font-weight:800;line-height:.95;font-size:15px;letter-spacing:.01em;text-transform:uppercase}
.brand .mark small{display:block;color:var(--accent);font-size:9px;letter-spacing:.3em;font-weight:700}
.brand h1{font-family:var(--f-display);font-size:22px;margin:0;font-weight:700;line-height:1.1;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.countdown{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jx{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--accent);line-height:1}
.sync{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)}.dot.err{background:var(--bad)}.dot.local{background:var(--warn)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:600 15px var(--f-display);background:none;border:0;color:var(--muted);padding:13px 14px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button.live{color:var(--accent)}
main .wrap{padding-block:20px 60px}
h2{font-family:var(--f-display);font-size:24px;margin:0 0 4px;font-weight:700;text-wrap:balance}
h3{font-family:var(--f-display);font-size:18px;margin:0;font-weight:700}
.lead{color:var(--muted);margin:0 0 16px;max-width:75ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi .n{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
.kpi .s{font-size:13px;margin-top:6px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{font:700 14px var(--f-body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--card)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.lg{padding:12px 16px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid color-mix(in srgb,var(--violet) 60%,transparent);outline-offset:2px}
input[type=text],input[type=search],input[type=number],input[type=email],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input.big{font-size:18px;padding:12px 14px;width:100%}
textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f > input,label.f > select{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{font-family:var(--f-mono);font-size:11px;opacity:.75}
.chip.now{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--violet)}.pill.acc{background:color-mix(in srgb,var(--accent) 14%,var(--card));color:var(--accent)}
.t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}.small{font-size:13px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.slot-h td{background:color-mix(in srgb,var(--violet) 8%,var(--card));font-family:var(--f-display);font-weight:700;font-size:16px}
.name{font-weight:700}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:6px}
.alert{border-radius:var(--r);padding:10px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.ok{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.alert.bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
/* courbe créneaux */
.slots-chart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(34px,1fr);gap:6px;align-items:end;height:170px;padding-top:18px;overflow-x:auto}
.sc{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;position:relative}
.sc .b{width:70%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.sc .b.miss{background:repeating-linear-gradient(45deg,var(--bad),var(--bad) 4px,color-mix(in srgb,var(--bad) 60%,var(--card)) 4px,color-mix(in srgb,var(--bad) 60%,var(--card)) 8px)}
.sc .v{font:700 12px var(--f-mono)}
.sc .x{font:500 11px var(--f-mono);color:var(--muted)}
/* jour J */
.live{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.live{grid-template-columns:1fr}}
.clock{font-family:var(--f-mono);font-weight:700;font-size:26px}
.fam{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.fam + .fam{margin-top:8px}
.fam.st-visite{border-left:5px solid var(--violet)}
.fam.st-arrive{border-left:5px solid var(--sun);background:color-mix(in srgb,var(--sun) 7%,var(--card))}
.fam.st-fini{opacity:.6}
.fam.st-absent{opacity:.45}
.fam .who{font-weight:700;font-size:16px}
.fam .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.stu{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stu:last-child{border-bottom:0}
.stu .nm{font-weight:700}
.sec-t{font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px;display:flex;gap:8px;align-items:center}
.freebox{display:flex;flex-wrap:wrap;gap:6px}
.free{border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-bg);color:var(--ink);border-radius:8px;padding:6px 9px;font-size:13px}
.free b{display:block}
/* docs */
.doc{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:start}
.doc .th{width:110px;height:140px;border:1px solid var(--line);border-radius:6px;background:var(--sunk) center top/cover no-repeat}
.doc h3{font-size:16px}
.doc p{margin:4px 0 10px;font-size:13px;color:var(--muted)}
.qr{background:#fff;padding:10px;border-radius:8px;display:inline-block;border:1px solid var(--line)}
.qr img,.qr canvas{display:block;width:180px;height:180px;image-rendering:pixelated}
/* checklist */
.todo{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input{width:18px;height:18px;accent-color:var(--accent)}
.todo.done .lbl{text-decoration:line-through;color:var(--muted)}
.todo .lbl{flex:1;min-width:0}
/* modal */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(20,10,30,.45)}
.dlg-h{padding:16px 18px 6px;display:flex;justify-content:space-between;gap:8px;align-items:start}
.dlg-b{padding:6px 18px 12px;display:grid;gap:12px}
.dlg-f{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:min(560px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:600 13px var(--f-body);border:0;background:var(--card);color:var(--muted);padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ie{font:700 12px var(--f-body);border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;padding:3px 6px;cursor:pointer}
.ie.set{color:var(--ink);border-color:var(--ink)}
#lock{position:fixed;inset:0;z-index:60;background:var(--paper);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.lockbox{width:min(380px,100%);display:grid;gap:14px;text-align:center;justify-items:center}
.lockbox input{font:700 28px var(--f-mono);text-align:center;letter-spacing:.3em;width:100%;padding:12px}
.lockbox .msg{min-height:20px;color:var(--bad);font-size:14px}
.sync{cursor:pointer;background:none;border:0;font:inherit;color:var(--muted)}
.dot.busy{background:var(--sun)}
@media (prefers-reduced-motion:no-preference){.fam,.chip,.btn{transition:border-color .15s,background .15s}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">
    <div class="mark"><small>Invitation</small>Portes<br>ouvertes</div>
    <div><h1 id="hTitle">Collège Lili Keller Rosenberg</h1><p id="hSub">Samedi 14 novembre 2026 · 9h – 12h</p></div>
  </div>
  <div class="countdown"><span class="jx" id="jx">J-?</span><button class="sync" id="sync" type="button"><span class="dot"></span>Connexion…</button><button class="btn sm ghost" id="lockBtn" type="button" hidden>Verrouiller</button></div>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist" id="tabs">
  <button role="tab" data-tab="prep">Préparation</button>
  <button role="tab" data-tab="inscr">Inscriptions</button>
  <button role="tab" data-tab="eleves">Élèves</button>
  <button role="tab" data-tab="plan">Planning</button>
  <button role="tab" data-tab="accueil" class="live">Accueil jour J</button>
  <button role="tab" data-tab="docs">Documents</button>
</div></nav>
<main><div class="wrap" id="view"></div></main>
<dialog id="dlg"></dialog>
<div id="lock" hidden></div>
<input type="file" id="fileIn" hidden>

<script>
/* ============ Données & réglages ============ */
const DEFAULT_CONFIG={
  college:"Collège Lili Keller Rosenberg", ville:"Halluin", date:"2026-11-14", dateTexte:"samedi 14 novembre 2026", horaires:"9h – 12h",
  eventoUrl:"https://evento.renater.fr/survey/inscriptions-portes-ouvertes-college-lili-keller-rosenberg-14-novembre-2026-zd2hovpw",
  slots:["9h00","9h15","9h30","9h45","10h00","10h15","10h30","10h45","11h00","11h15","11h30","11h45"],
  dureeVisite:60, battement:5, avance:10, maxVisites:3, maxFamilles:2, strategie:"repartir",
  heureAteliers:"8h50", heureReserve:"8h50", heureFin:"12h20",
  responsable:"M. Nollet", signature:"M. Nollet et l'équipe enseignante.", dateCourrier:"", lieuRdv:"auprès de M. Nollet"
};
const S={config:{...DEFAULT_CONFIG},eleves:{},familles:{},ateliers:{},taches:{}};
const COLLS=["eleves","familles","ateliers","taches"];
const LS_KEY="po-lkr-2026-v1";
const UI={tab:"prep",slot:"all",q:"",eFilter:"all",eQ:"",planView:"slot",liveSlot:null,liveQ:""};
try{const t=localStorage.getItem("po-tab"); if(t) UI.tab=t;}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9@.]+/g," ").trim();
function tmin(s){if(s==null||s==="")return null;if(typeof s==="number"){ if(s<1) return Math.round(s*1440); return null;}const m=String(s).match(/(\d{1,2})\s*[hH:]\s*(\d{2})?/);if(!m)return null;const h=+m[1],mi=+(m[2]||0);if(h>23||mi>59)return null;return h*60+mi;}
const fmt=m=>m==null?"—":Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");
const isJ=()=>new Date().toLocaleDateString("sv-SE")===S.config.date;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const C=()=>S.config;
const fullName=e=>`${(e.nom||"").trim()} ${(e.prenom||"").trim()}`.trim();
const niveau=c=>{const m=String(c||"").match(/[3456]/);return m?+m[0]:9;};

/* ============ Stockage : cet appareil + synchronisation entre appareils (Netlify) ============ */
let MODE="local", LOADED=false;
const ONLINE=(()=>{try{return window.top===window&&(location.protocol==="https:"||location.hostname==="localhost")}catch(e){return false}})();
const SK=LS_KEY+"-sync";
let SY={code:null,etag:null,base:null,cfg:null,unlocked:false,busy:false,timer:null};
try{Object.assign(SY,JSON.parse(localStorage.getItem(SK)||"{}"));}catch(e){}
SY.busy=false;SY.timer=null;
function persistSY(){const o={code:SY.code,cfg:SY.cfg,unlocked:SY.unlocked};try{localStorage.setItem(SK,JSON.stringify({...o,etag:SY.etag,base:SY.base}));}catch(e){try{localStorage.setItem(SK,JSON.stringify(o));}catch(_){}}}
function setSync(kind,msg){const el=$("#sync");if(!el)return;const map={ok:["ok","Synchronisé"],busy:["busy","Synchro…"],off:["","Hors ligne"],err:["err","Erreur de synchro"],local:["local","Enregistré sur cet appareil"],init:["","Connexion…"]};const [c,t]=map[kind]||map.init;el.innerHTML=`<span class="dot ${c}"></span>${esc(t)}`;el.title=msg||t;}
const payload=()=>JSON.parse(JSON.stringify({config:S.config,eleves:S.eleves,familles:S.familles,ateliers:S.ateliers,taches:S.taches}));
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);S.config={...DEFAULT_CONFIG,...(o.config||{})};COLLS.forEach(c=>S[c]=o[c]||{});}}catch(e){}}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(payload()));}catch(e){toast("Mémoire de l'appareil pleine : exporte une sauvegarde depuis Documents.");}}
function saveLocal(){writeLocal();scheduleSync();}
function applyRemote(d){S.config={...DEFAULT_CONFIG,...(d.config||{})};COLLS.forEach(c=>S[c]=JSON.parse(JSON.stringify(d[c]||{})));writeLocal();schedule();}
const strip=d=>{const x={...d};delete x.id;return x;};
async function put(c,id,data){S[c][id]={...strip(data),id};schedule();saveLocal();}
async function putMany(c,entries){entries.forEach(([id,d])=>S[c][id]={...strip(d),id});schedule();saveLocal();}
async function delMany(c,ids){ids.forEach(id=>delete S[c][id]);schedule();saveLocal();}
const del=(c,id)=>delMany(c,[id]);
async function putConfig(p){S.config={...S.config,...p};schedule();saveLocal();}

/* --- synchronisation (fonction Netlify /api/sync + code d'accès) --- */
const isObj=x=>!!x&&typeof x==="object"&&!Array.isArray(x);
const same=(a,b)=>a===b||JSON.stringify(a)===JSON.stringify(b);
function merge3(b,l,r){if(same(l,b))return r;if(same(r,b))return l;if(same(l,r))return l;
  if(isObj(l)&&isObj(r)&&(b===undefined||isObj(b))){const out={};for(const k of new Set([...Object.keys(l),...Object.keys(r)])){const m=merge3(b?b[k]:undefined,l[k],r[k]);if(m!==undefined)out[k]=m;}return out;}
  return l;}
const hasData=d=>!!(d&&(Object.keys(d.eleves||{}).length||Object.keys(d.familles||{}).length));
async function api(op,extra,code){const r=await fetch("/api/sync",{method:"POST",cache:"no-store",headers:{"content-type":"application/json"},body:JSON.stringify({op,code:code??SY.code,...(extra||{})})});
  if(r.status===401){const e=new Error("code");e.code=401;throw e;}let j={};try{j=await r.json();}catch(e){}
  if(r.status===409)return {conflict:true};if(!r.ok)throw new Error(j.error||("Erreur serveur "+r.status));return j;}
function scheduleSync(){if(!ONLINE||!SY.unlocked)return;clearTimeout(SY.timer);SY.timer=setTimeout(syncNow,800);}
async function syncNow(){if(!ONLINE||!SY.unlocked||SY.busy)return;
  if(!navigator.onLine){setSync("off","Hors ligne : les modifications partiront au retour du réseau.");return;}
  SY.busy=true;setSync("busy");
  try{for(let tries=0;tries<6;tries++){const local=payload(),ls=JSON.stringify(local);
      if(!SY.etag){const g=await api("get");
        if(g.empty){const p=await api("put",{data:local});if(p.conflict)continue;SY.etag=p.etag;SY.base=local;break;}
        const merged=hasData(local)?merge3(undefined,g.data,local):g.data;
        if(same(merged,g.data)){applyRemote(g.data);SY.etag=g.etag;SY.base=g.data;break;}
        const p=await api("put",{data:merged,etag:g.etag});if(p.conflict)continue;applyRemote(merged);SY.etag=p.etag;SY.base=merged;break;}
      if(ls!==JSON.stringify(SY.base)){const p=await api("put",{data:local,etag:SY.etag});
        if(p.conflict){const g=await api("get");if(g.empty){SY.etag=null;continue;}applyRemote(merge3(SY.base,payload(),g.data));SY.etag=g.etag;SY.base=g.data;continue;}
        SY.etag=p.etag;SY.base=local;continue;}
      const g=await api("get",{etag:SY.etag});if(g.same)break;if(g.empty){SY.etag=null;SY.base=null;continue;}
      const now=payload();const changed=JSON.stringify(now)!==ls;applyRemote(changed?merge3(SY.base,now,g.data):g.data);SY.etag=g.etag;SY.base=g.data;if(changed)continue;break;}
    persistSY();setSync("ok","Tous les appareils connectés partagent les mêmes données.");
  }catch(e){if(e.code===401){SY.unlocked=false;persistSY();showLock("Le code d'accès a changé. Entre le nouveau code.");}else setSync(navigator.onLine?"err":"off",e.message||"Synchronisation impossible");}
  finally{SY.busy=false;}}
async function sha(t){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function showLock(msg){const el=$("#lock");el.hidden=false;$("#lockBtn").hidden=true;setSync("off");
  el.innerHTML=`<form class="lockbox" id="lockF"><div class="brand"><div class="mark"><small>Invitation</small>Portes<br>ouvertes</div></div><h2>Code d'accès</h2><p class="muted" style="margin:0">Les inscriptions et la liste des élèves sont protégées. Entre le code pour accéder à l'outil.</p>
  <input type="password" id="lockIn" inputmode="numeric" autocomplete="current-password" maxlength="8" aria-label="Code d'accès"><button class="btn pri lg" style="width:100%;justify-content:center">Entrer</button><div class="msg" id="lockMsg">${esc(msg||"")}</div></form>`;
  const i=$("#lockIn");setTimeout(()=>i.focus(),50);$("#lockF").onsubmit=e=>{e.preventDefault();tryUnlock(i.value.trim());};}
async function tryUnlock(code){if(!code)return;const m=$("#lockMsg");m.style.color="var(--muted)";m.textContent="Vérification…";let ok=false,cfg=null,offline=false;
  try{const j=await api("login",null,code);ok=!!j.ok;cfg={salt:j.salt,hash:j.hash};}
  catch(e){if(e.code!==401){offline=true;try{ok=!!(SY.cfg&&SY.cfg.salt)&&(await sha(SY.cfg.salt+":"+code))===SY.cfg.hash;}catch(_){ok=false;}}}
  m.style.color="";if(!ok){m.textContent=offline?"Pas de réseau et code inconnu sur cet appareil.":"Code incorrect.";$("#lockIn").value="";return;}
  SY.code=code;SY.unlocked=true;if(cfg)SY.cfg=cfg;persistSY();$("#lock").hidden=true;$("#lock").innerHTML="";$("#lockBtn").hidden=false;toast(offline?"Déverrouillé (hors ligne)":"Bienvenue !");render();syncNow();}

function convoc(e){const c=C();const v=visitsOf(e.id);let h=null,role="",fin=tmin(c.heureFin);
  if(e.role==="atelier"){h=tmin(e.heureConv)??tmin(c.heureAteliers);role=`participera à l'atelier ${e.atelier||""}`.trim();

/* ============ Attribution automatique ============ */
function busyMap(excl){const m={},c=C();Object.values(S.familles).forEach(f=>{if(f.statut==="absent"||(excl&&excl.has(f.id)))return;const sid=f.eleve||f.elevePrevu;if(!sid)return;const st=f.hDepart?tmin(f.hDepart):tmin(f.slot);if(st==null)return;const end=f.hRetour?tmin(f.hRetour):st+c.dureeVisite+c.battement;(m[sid]=m[sid]||[]).push({start:st,end,fam:f.id});});return m;}
function allocate(fams){
  const c=C(),targets=new Set(fams.map(f=>f.id)),busy=busyMap(targets);
  const studs=Object.values(S.eleves).filter(e=>isGuide(e)&&e.presence!=="absent");
  const order=fams.slice().sort((a,b)=>(tmin(a.slot)??9999)-(tmin(b.slot)??9999)||norm(a.nom).localeCompare(norm(b.nom)));
  const out=[],missing=[];
  const nVis=s=>new Set((busy[s.id]||[]).map(x=>x.start)).size;
  for(const f of order){const t=tmin(f.slot);if(t==null){missing.push(f);continue;}
    const free=studs.filter(s=>{const iv=busy[s.id]||[];if(nVis(s)>=c.maxVisites)return false;const d=tmin(s.dispoDes);if(d!=null&&d>t-c.avance)return false;
      return iv.every(x=>t>=x.end||t+c.dureeVisite+c.battement<=x.start);});
    let pick=null;
    if(free.length){const lastEnd=s=>Math.max(-1,...(busy[s.id]||[]).filter(x=>x.end<=t).map(x=>x.end));
      free.sort((a,b)=>((b.presence==="present")-(a.presence==="present"))||((b.confirme!==false)-(a.confirme!==false))||(c.strategie==="reserve"?nVis(b)-nVis(a):nVis(a)-nVis(b))||((a.role==="visite"?0:1)-(b.role==="visite"?0:1))||(nVis(a)&&nVis(b)?lastEnd(b)-lastEnd(a):0)||(niveau(a.classe)-niveau(b.classe))||norm(a.nom).localeCompare(norm(b.nom)));
      pick=free[0];}
    else if(c.maxFamilles>1){const grp=studs.filter(s=>{const at=(busy[s.id]||[]).filter(x=>x.start===t);return at.length>0&&at.length<c.maxFamilles;});
      grp.sort((a,b)=>(busy[a.id]||[]).filter(x=>x.start===t).length-(busy[b.id]||[]).filter(x=>x.start===t).length);pick=grp[0]||null;if(pick)f._grouped=true;}
    if(pick){(busy[pick.id]=busy[pick.id]||[]).push({start:t,end:t+c.dureeVisite+c.battement,fam:f.id});out.push([f,pick]);}else missing.push(f);}
  return {out,missing};}
async function applyAlloc(fams,clearFirst){const res=allocate(fams.map(f=>clearFirst?{...f,elevePrevu:null}:f));
  const entries=[];res.out.forEach(([f,s])=>entries.push([f.id,{...S.familles[f.id],elevePrevu:s.id}]));
  res.missing.forEach(f=>{if(clearFirst||S.familles[f.id].elevePrevu)entries.push([f.id,{...S.familles[f.id],elevePrevu:null}]);});
  await putMany("familles",entries);return res;}
/* réattribue les familles à venir d'un élève devenu indisponible */
async function repairFor(sid,reason){const c=C();const now=nowMin();const busyLive=Object.values(S.familles).find(f=>f.eleve===sid&&f.statut==="visite");
  const victims=Object.values(S.familles).filter(f=>f.elevePrevu===sid&&!f.eleve&&(f.statut==="inscrit"||f.statut==="arrive"||!f.statut)&&(reason==="absent"||(busyLive&&tmin(f.slot)<tmin(busyLive.hDepart)+c.dureeVisite+c.battement)));
  if(!victims.length)return;const res=await applyAlloc(victims.map(f=>({...f,elevePrevu:null})),true);

/* lecture de fichiers tableur */
function readRows(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error("lecture"));r.onload=()=>{try{const wb=XLSX.read(r.result,{type:"array",cellDates:false});
  let best=null;wb.SheetNames.forEach(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false});if(!best||rows.length>best.length)best=rows;});res(best||[]);}catch(e){rej(e);}};r.readAsArrayBuffer(file);});}
const YES=v=>{const s=norm(v);if(!s)return false;if(/^(non|no|n|0|false|faux|-|nok)$/.test(s))return false;return /^(oui|yes|y|1|x|ok|true|vrai|si necessaire|v)$/.test(s)||/oui|✓|✔/.test(String(v).toLowerCase())||String(v).trim()==="✓"||String(v).trim()==="✔";};
const TIME_RE=/(\d{1,2})\s*[hH:]\s*(\d{2})?/;
function parseEvento(rows){rows=rows.map(r=>r.map(c=>String(c??"").trim())).filter(r=>r.some(c=>c));if(!rows.length)return {fams:[],slots:[]};
  const W=Math.max(...rows.map(r=>r.length));
  // cas 1 : une colonne « créneau » par ligne
  for(let h=0;h<Math.min(6,rows.length);h++){const hdr=rows[h];const ci=hdr.findIndex(x=>/cr[ée]neau|horaire|heure de visite/i.test(x));if(ci>=0&&rows.slice(h+1).some(r=>TIME_RE.test(r[ci]||""))){return mapRows(rows.slice(h+1),hdr,null,ci);}}
  // cas 2 : une colonne par créneau (format sondage Evento)
  let best=null;
  for(let h=1;h<Math.min(10,rows.length);h++){const labels=[];for(let c=0;c<W;c++)labels.push(rows.slice(0,h).map(r=>r[c]||"").filter(Boolean).join(" "));
    const slotCols=[];labels.forEach((l,c)=>{const m=l.match(TIME_RE);if(m&&c>0)slotCols.push([c,tmin(m[0])]);});
    if(!slotCols.length)continue;const data=rows.slice(h);const score=data.filter(r=>slotCols.some(([c])=>YES(r[c]))).length;
    if(!best||score>best.score)best={h,labels,slotCols,score};}
  if(!best||!best.score)return {fams:[],slots:[],err:"Je n'ai pas trouvé de colonnes de créneaux (ex. « 9h00 ») avec des réponses « Oui »."};
  return mapRows(rows.slice(best.h),best.labels,best.slotCols,null);}
function mapRows(data,hdr,slotCols,slotCol){const H=hdr.map(x=>norm(x));
  const find=re=>H.findIndex((x,i)=>re.test(x)&&!(slotCols||[]).some(([c])=>c===i));
  let iNom=find(/^nom|nom$|name|participant|identit|famille/);let iPre=find(/prenom|first/);let iMail=find(/mail/);let iNb=find(/nombre|personnes|\bnb\b|combien/);let iTel=find(/tel|phone|portable/);
  if(iPre===iNom)iPre=-1;if(iNom<0)iNom=0;
  if(iMail<0){for(let c=0;c<hdr.length;c++){if(data.some(r=>/@/.test(r[c]||""))){iMail=c;break;}}}
  const used=new Set([iNom,iPre,iMail,iNb,iTel,slotCol,...(slotCols||[]).map(x=>x[0])]);
  const fams=[];data.forEach(r=>{let nom=(r[iNom]||"").trim();if(!nom||/^(total|nombre|somme|count)/i.test(nom)||/^\d+$/.test(nom))return;
    let prenom=iPre>=0?(r[iPre]||"").trim():"";if(!prenom&&nom.includes(" ")){const parts=nom.split(/\s+/);const up=parts.filter(p=>p===p.toUpperCase()&&/[A-Z]/.test(p));if(up.length&&up.length<parts.length){prenom=parts.filter(p=>!up.includes(p)).join(" ");nom=up.join(" ");}}
    let slots=[];if(slotCol!=null){const m=(r[slotCol]||"").match(TIME_RE);if(m)slots=[fmt(tmin(m[0]))];}else slots=slotCols.filter(([c])=>YES(r[c])).map(([,t])=>fmt(t));
    const infos=hdr.map((h,c)=>used.has(c)||!r[c]?null:`${h?h+" : ":""}${r[c]}`).filter(Boolean).join(" · ");
    fams.push({nom:nom.toUpperCase(),prenom,email:iMail>=0?r[iMail]||"":"",tel:iTel>=0?r[iTel]||"":"",nb:iNb>=0?(parseInt(r[iNb])||1):1,slot:slots[0]||"",autres:slots.slice(1),infos});});
  const sl=[...new Set(fams.map(f=>f.slot).filter(Boolean))].sort((a,b)=>tmin(a)-tmin(b));return {fams,slots:sl};}
const famKey=f=>norm(f.email)||norm(f.nom+" "+(f.prenom||""));
function previewEvento(rows){const r=parseEvento(rows);if(r.err||!r.fams.length){openDlg("Import impossible",`<div class="alert bad">${esc(r.err||"Aucune famille trouvée dans ce fichier.")}</div><p class="small muted">Vérifie que le fichier contient une ligne par famille et une colonne par créneau (ou une colonne « Créneau »).</p>`);return;}
  const existing={};famList().forEach(f=>{if(f.source!=="manuel")existing[famKey(f)]=f;});const keys=new Set(r.fams.map(famKey));
  const nNew=r.fams.filter(f=>!existing[famKey(f)]).length,nUpd=r.fams.filter(f=>existing[famKey(f)]&&existing[famKey(f)].slot!==f.slot).length;
  const gone=Object.values(existing).filter(f=>!keys.has(famKey(f))&&(f.statut||"inscrit")==="inscrit");const multi=r.fams.filter(f=>f.autres.length);const noS=r.fams.filter(f=>!f.slot);
  openDlg("Vérifier l'import",`<div class="alert ok">${r.fams.length} familles lues · ${nNew} nouvelles · ${nUpd} changements de créneau</div>
  <div class="chips">${r.slots.map(s=>`<span class="chip">${s} <span class="c">${r.fams.filter(f=>f.slot===s).length}</span></span>`).join("")}</div>
  ${multi.length?`<div class="alert">${multi.length} famille(s) ont coché plusieurs créneaux : je garde le premier (${esc(multi.slice(0,4).map(f=>f.nom).join(", "))}${multi.length>4?"…":""}).</div>`:""}
  ${noS.length?`<div class="alert">${noS.length} ligne(s) sans créneau coché seront importées « sans créneau ».</div>`:""}
  ${gone.length?`<label class="row small"><input type="checkbox" id="rmGone"> Retirer ${gone.length} famille(s) absente(s) de ce nouvel export (désinscrites) : ${esc(gone.slice(0,5).map(f=>f.nom).join(", "))}${gone.length>5?"…":""}</label>`:""}
  ${(C().slots.join()!==[...new Set([...C().slots,...r.slots])].sort((a,b)=>tmin(a)-tmin(b)).join())?`<p class="small muted" style="margin:0">De nouveaux créneaux seront ajoutés aux réglages.</p>`:""}
  <div class="tbl-wrap" style="max-height:240px"><table><thead><tr><th>Famille</th><th>Créneau</th><th>Pers.</th><th>E-mail</th></tr></thead><tbody>${r.fams.slice(0,60).map(f=>`<tr><td>${esc(f.nom)} ${esc(f.prenom)}</td><td class="t">${esc(f.slot||"—")}</td><td>${f.nb}</td><td class="small">${esc(f.email)}</td></tr>`).join("")}</tbody></table></div>`,
  `<button class="btn" data-close>Annuler</button><button class="btn pri" id="impOk">Importer ${r.fams.length} familles</button>`,d=>{d.querySelector("#impOk").onclick=async()=>{
    const rm=d.querySelector("#rmGone")&&d.querySelector("#rmGone").checked;d.close();const entries=[];
    r.fams.forEach(f=>{const ex=existing[famKey(f)];const base={nom:f.nom,prenom:f.prenom,email:f.email,tel:f.tel,nb:f.nb,slot:f.slot,infos:f.infos,source:"evento"};
      if(ex){const nf={...ex,...base};if(ex.slot!==f.slot&&!ex.eleve)nf.elevePrevu=null;entries.push([ex.id,nf]);}else entries.push([uid(),{...base,statut:"inscrit",elevePrevu:null}]);});
    const newSlots=[...new Set([...C().slots,...r.slots])].sort((a,b)=>tmin(a)-tmin(b));if(newSlots.join()!==C().slots.join())await putConfig({slots:newSlots});
    await putMany("familles",entries);if(rm)await delMany("familles",gone.map(f=>f.id));toast(`${entries.length} familles importées. Pense à compléter le planning.`);};});}

function roleFrom(rem){const r=norm(rem);if(/escalade/.test(r))return {role:"atelier",atelier:"escalade",aussiVisite:/visite/.test(r)};if(/chorale/.test(r))return {role:"atelier",atelier:"chorale",aussiVisite:/visite/.test(r)};if(!r||/accompagn|visite|famille/.test(r))return {role:"visite",atelier:"",aussiVisite:false};return {role:"atelier",atelier:String(rem).replace(/participera (a|à) l'?atelier/i,"").trim(),aussiVisite:false};}
function importEleves(rows){rows=rows.map(r=>r.map(c=>String(c??"").trim()));const h=rows.findIndex(r=>r.some(c=>norm(c)==="nom"));if(h<0)return toast("Colonne « nom » introuvable dans le fichier.");
  const H=rows[h].map(norm);const ix=re=>H.findIndex(x=>re.test(x));const iN=ix(/^nom$/),iP=ix(/^prenom/),iC=ix(/^classe/),iG=ix(/il ou elle|genre|sexe/),iR=ix(/remarque|role/),iA=ix(/heure arrivee|arrivee/),iK=ix(/^colonne1$|confirm/);
  const existing={};Object.values(S.eleves).forEach(e=>existing[norm(fullName(e))]=e);const entries=[];
  rows.slice(h+1).forEach(r=>{const nom=(r[iN]||"").replace(/\.$/,"").trim();if(!nom)return;const prenom=(r[iP]||"").trim();const g=norm(r[iG]);const rr=roleFrom(r[iR]);
    const ex=existing[norm(nom+" "+prenom)];const base={nom:nom.toUpperCase(),prenom:prenom,classe:(r[iC]||"").trim(),genre:g==="elle"||g==="f"||g==="fille"?"elle":g==="il"||g==="g"||g==="garcon"?"il":(ex?ex.genre:""),...rr,confirme:iK>=0?!/false|faux|^0$|non/i.test(r[iK]):true};
    entries.push([ex?ex.id:uid(),ex?{...ex,...base}:{...base,presence:"",dispoDes:""}]);});
  if(!entries.length)return toast("Aucun élève trouvé.");
  ask(`Importer ${entries.length} élèves ? (${entries.filter(([,e])=>isGuide(e)).length} pour les visites, ${entries.filter(([,e])=>e.role==="atelier").length} sur un atelier). Les élèves déjà présents sont mis à jour.`,"Importer").then(ok=>{if(ok){putMany("eleves",entries);toast(`${entries.length} élèves importés.`);}});}
function editEleve(id){const e=id?S.eleves[id]:{nom:"",prenom:"",classe:"",genre:"",role:"visite",atelier:"",aussiVisite:false,confirme:true,presence:"",dispoDes:"",heureConv:"",remarque:""};
  openDlg(id?"Modifier l'élève":"Ajouter un élève",`<div class="fgrid"><label class="f">Nom<input type="text" id="eN" value="${esc(e.nom)}"></label><label class="f">Prénom<input type="text" id="eP" value="${esc(e.prenom)}"></label>
  <label class="f">Classe<input type="text" id="eC" value="${esc(e.classe)}"></label><label class="f">Il / elle<select id="eG"><option value="">—</option><option value="il" ${e.genre==="il"?"selected":""}>il</option><option value="elle" ${e.genre==="elle"?"selected":""}>elle</option></select></label>
  <label class="f">Rôle<select id="eR"><option value="visite" ${e.role==="visite"?"selected":""}>Accompagne des familles</option><option value="atelier" ${e.role==="atelier"?"selected":""}>Atelier</option></select></label><label class="f">Atelier<input type="text" id="eA" value="${esc(e.atelier||"")}" placeholder="chorale, escalade…"></label>
  <label class="f">Disponible à partir de<input type="text" id="eD" value="${esc(e.dispoDes||"")}" placeholder="ex. 10h00"></label><label class="f">Heure de convocation imposée<input type="text" id="eH" value="${esc(e.heureConv||"")}" placeholder="sinon calculée"></label></div>
  <label class="row small"><input type="checkbox" id="eV" ${e.aussiVisite?"checked":""}> Atelier + peut aussi accompagner une famille</label>
  <label class="row small"><input type="checkbox" id="eK" ${e.confirme!==false?"checked":""}> Confirmé (prioritaire dans l'attribution)</label>
  <label class="f">Remarque<input type="text" id="eM" value="${esc(e.remarque||"")}"></label>`,
  `${id?'<button class="btn ghost" id="eDel" style="color:var(--bad)">Supprimer</button><span class="sp"></span>':""}<button class="btn" data-close>Annuler</button><button class="btn pri" id="eOk">Enregistrer</button>`,d=>{

/* ---------- Planning ---------- */
function vPlan(v){const c=C(),fams=famList().filter(f=>f.statut!=="absent"),slots=slotsAll();const guides=Object.values(S.eleves).filter(e=>isGuide(e)&&e.presence!=="absent");

  <div class="row" style="margin-bottom:12px"><div class="seg"><button aria-pressed="${UI.planView==="slot"}" data-pv="slot">Par créneau</button><button aria-pressed="${UI.planView==="eleve"}" data-pv="eleve">Par heure d'arrivée des élèves</button></div><span class="sp"></span>

  <div id="planBody"></div>`;

function optStudents(f,cur){const c=C(),t=tmin(f.slot),busy=busyMap(new Set([f.id]));return Object.values(S.eleves).filter(e=>isGuide(e)&&e.presence!=="absent").map(e=>{const iv=busy[e.id]||[];const ok=iv.every(x=>t>=x.end||t+c.dureeVisite+c.battement<=x.start);const same=iv.filter(x=>x.start===t).length;return {e,ok,same,n:new Set(iv.map(x=>x.start)).size};})

  .map(({e,ok,same,n})=>`<option value="${e.id}" ${e.id===cur?"selected":""}>${esc(fullName(e))} (${esc(e.classe)})${e.id===cur?"":ok?` · libre${n?", "+n+" visite(s)":""}`:same?" · déjà 1 famille à cette heure":" · occupé"}</option>`).join("");}

function qrCanvas(text,cell){const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),m=4,cv=document.createElement("canvas");cv.width=cv.height=(n+m*2)*cell;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+m)*cell,(r+m)*cell,cell,cell);return cv;}
function drawQR(){const b=$("#qrBox");if(!b||typeof qrcode==="undefined")return;try{const cv=qrCanvas(C().eventoUrl,6);b.innerHTML="";b.appendChild(cv);}catch(e){b.textContent="Lien trop long pour un QR code.";}}

const P=s=>String(s??"").replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/–|—/g,"-").replace(/…/g,"...").replace(/ | /g," ");
function newPdf(o){if(!window.jspdf){toast("Le générateur PDF n'est pas chargé, recharge la page.");return null;}return new window.jspdf.jsPDF({unit:"mm",format:"a4",...(o||{})});}

  const doc=newPdf();if(!doc)return;const dc=c.dateCourrier||new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  el.forEach((e,i)=>{if(i&&i%2===0)doc.addPage();const y0=i%2===0?0:148.5;const cv=convoc(e);

    doc.setFont("helvetica","normal");doc.setFontSize(11.5);let y=y0+50;doc.text("Chers parents,",18,y);y+=9;
    const paras=[`Votre enfant ${e.nom} ${e.prenom} en ${e.classe} a souhaité participer aux portes ouvertes du collège ce ${c.dateTexte}.`,
      `${ilElle(e)} est à ce titre convoqué${accord(e)} à ${fmt(cv.h)} et devra se présenter ${c.lieuRdv}.`,`${ilElle(e)} ${cv.role}.`,`Selon l'affluence, votre enfant sera libéré${accord(e)} au plus tard à ${fmt(cv.fin)}.`];
    paras.forEach(p=>{const lines=doc.splitTextToSize(P(p),174);doc.text(lines,18,y);y+=lines.length*5.6+2.5;});
    y+=4;doc.text("Cordialement,",18,y);doc.text(P(c.signature),192,y+8,{align:"right"});
    if(i%2===0){doc.setLineDashPattern([2,2],0);doc.setDrawColor(150);doc.line(10,148.5,200,148.5);doc.setLineDashPattern([],0);}});

function tablePdf(doc,title,sub,cols,rows,opt={}){let y=18;const W=opt.landscape?297:210,H=opt.landscape?210:297;const head=()=>{doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text(P(title),12,y);doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(110);doc.text(P(sub),12,y+5.5);doc.setTextColor(0);y+=12;hdr();};
  const hdr=()=>{doc.setFillColor(238,232,244);doc.rect(12,y-4.5,W-24,7,"F");doc.setFont("helvetica","bold");doc.setFontSize(9);let x=12;cols.forEach(cl=>{doc.text(P(cl.t),x+1.5,y);x+=cl.w;});y+=6;doc.setFont("helvetica","normal");};
  head();rows.forEach(r=>{if(r.section){if(y>H-22){doc.addPage();y=18;hdr();}doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text(P(r.section),12,y+1);doc.setFont("helvetica","normal");y+=7;return;}
    doc.setFontSize(9.5);const cells=cols.map((cl,i)=>doc.splitTextToSize(P(r[i]??""),cl.w-3));const h=Math.max(...cells.map(c=>c.length))*4.3+2.2;if(y+h>H-12){doc.addPage();y=18;hdr();}
    let x=12;cells.forEach((c,i)=>{if(cols[i].box){doc.rect(x+2,y-3.2,3.6,3.6);}else doc.text(c,x+1.5,y);x+=cols[i].w;});doc.setDrawColor(220);doc.line(12,y+h-3.6,W-12,y+h-3.6);y+=h;});}
function pdfPlanning(){const c=C();const el=Object.values(S.eleves).filter(e=>e.presence!=="absent").map(e=>({e,cv:convoc(e)})).sort((a,b)=>(a.cv.h??9999)-(b.cv.h??9999)||norm(a.e.nom).localeCompare(norm(b.e.nom)));if(!el.length)return toast("Aucun élève.");
  const doc=newPdf();if(!doc)return;const rows=[];let last=null;el.forEach(({e,cv})=>{if(cv.h!==last){rows.push({section:`Arrivée ${fmt(cv.h)}`});last=cv.h;}rows.push(["",fmt(cv.h),fullName(e),e.classe,(e.role==="atelier"?"Atelier "+e.atelier+(cv.visites.length?" + ":""):"")+(cv.visites.length?cv.visites.map(x=>fmt(x.t)+" "+x.fs.map(f=>f.nom).join("+")).join(" / "):cv.reserve?"Réserve":""),fmt(cv.fin)]);});
  tablePdf(doc,`Planning des élèves - ${c.dateTexte}`,`${el.length} élèves · arrivée ${c.avance} min avant la 1re visite · visite de ${c.dureeVisite} min`,[{t:"",w:8,box:1},{t:"Arrivée",w:18},{t:"Élève",w:50},{t:"Classe",w:16},{t:"Mission / visites",w:76},{t:"Fin",w:18}],rows);
  savePdf(doc,"planning_eleves_portes_ouvertes.pdf");}
function pdfAccueil(){const c=C();const slots=slotsAll();const fams=famList().filter(f=>f.statut!=="absent");if(!fams.length)return toast("Aucune famille inscrite.");
  const doc=newPdf();if(!doc)return;const rows=[];slots.forEach(s=>{const fs=famBySlot(s).filter(f=>f.statut!=="absent");if(!fs.length)return;rows.push({section:`${s} - ${fs.length} famille(s), ${pers(fs)} pers.`});fs.forEach(f=>{const sid=f.eleve||f.elevePrevu;const e=S.eleves[sid];rows.push(["",`${f.nom} ${f.prenom||""}`,f.nb||1,e?`${fullName(e)} (${e.classe})`:"",f.tel||"","",""]);});});
  tablePdf(doc,`Accueil des familles - ${c.dateTexte}`,`${fams.length} familles · ${pers(fams)} personnes · liste de secours papier`,[{t:"",w:8,box:1},{t:"Famille",w:52},{t:"Pers.",w:12},{t:"Élève prévu",w:52},{t:"Téléphone",w:28},{t:"Départ",w:17},{t:"Retour",w:17}],rows);
  savePdf(doc,"liste_accueil_familles.pdf");}
function pdfAffiche(){const c=C();const doc=newPdf();if(!doc)return;const cv=qrCanvas(c.eventoUrl,14);const img=cv.toDataURL("image/png");
  doc.setFillColor(196,32,111);doc.rect(0,0,210,14,"F");doc.setFont("helvetica","bold");doc.setFontSize(34);doc.text("PORTES OUVERTES",105,45,{align:"center"});
  doc.setFontSize(18);doc.setFont("helvetica","normal");doc.text(P(c.college+" - "+c.ville),105,58,{align:"center"});doc.setFont("helvetica","bold");doc.setTextColor(196,32,111);doc.text(P(cap(c.dateTexte)+" - "+c.horaires),105,70,{align:"center"});doc.setTextColor(0);
  doc.addImage(img,"PNG",45,84,120,120);doc.setFontSize(20);doc.text("Inscription obligatoire",105,220,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(13);doc.text("Scannez le QR code pour choisir votre créneau de visite.",105,230,{align:"center"});
  doc.setFontSize(8);doc.setTextColor(110);doc.text(doc.splitTextToSize(c.eventoUrl,180),105,245,{align:"center"});doc.setTextColor(0);doc.setFillColor(107,63,209);doc.rect(0,283,210,14,"F");
  savePdf(doc,"affiche_qrcode_inscription.pdf");}
function xlsExport(){if(!window.XLSX)return toast("Excel indisponible, recharge la page.");const wb=XLSX.utils.book_new();
  const fams=famList().sort((a,b)=>(tmin(a.slot)??9999)-(tmin(b.slot)??9999)||norm(a.nom).localeCompare(norm(b.nom))).map(f=>{const e=S.eleves[f.eleve||f.elevePrevu];return {Créneau:f.slot,Nom:f.nom,Prénom:f.prenom,Personnes:+f.nb||1,Email:f.email,Téléphone:f.tel,Informations:f.infos,"Élève":e?fullName(e):"",Classe:e?e.classe:"",Statut:ST[f.statut||"inscrit"][0],Arrivée:f.hArrivee||"",Départ:f.hDepart||"",Retour:f.hRetour||""};});
  const el=Object.values(S.eleves).map(e=>({e,cv:convoc(e)})).sort((a,b)=>(a.cv.h??9999)-(b.cv.h??9999)).map(({e,cv})=>({Nom:e.nom,Prénom:e.prenom,Classe:e.classe,"Il/elle":e.genre,Rôle:e.role==="atelier"?"Atelier "+e.atelier+(e.aussiVisite?" + visite":""):"Visite","Convoqué à":fmt(cv.h),Visites:cv.visites.map(x=>fmt(x.t)).join(", "),Familles:cv.visites.map(x=>x.fs.map(f=>f.nom).join("+")).join(" / "),"Libéré à":fmt(cv.fin),Présence:e.presence||""}));
  const at=Object.values(S.ateliers).map(a=>({Atelier:a.nom,Pôle:a.pole,Salle:a.salle,Professeur:a.prof,Horaires:a.horaires,Matériel:a.materiel,"Fiche reçue":a.ficheRecue?"oui":"non",Élèves:a.eleves}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(fams.length?fams:[{Créneau:""}]),"Familles");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(el.length?el:[{Nom:""}]),"Élèves");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(at.length?at:[{Atelier:""}]),"Ateliers");
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});saveFile("portes_ouvertes_export.xlsx",new Blob([out]));}
