<script>
/* ============ Données & réglages ============ */
const DEFAULT_CONFIG={
  college:"Collège Lili Keller Rosenberg", ville:"Halluin", date:"2026-11-14", dateTexte:"samedi 14 novembre 2026", horaires:"9h – 12h",
  eventoUrl:"https://evento.renater.fr/survey/inscriptions-portes-ouvertes-college-lili-keller-rosenberg-14-novembre-2026-zd2hovpw",
  slots:["9h00","9h15","9h30","9h45","10h00","10h15","10h30","10h45","11h00","11h15","11h30","11h45"],
  dureeVisite:60, battement:5, avance:10, delaiRetard:10, maxVisites:3, maxVisitesPrio:4, maxFamilles:2, strategie:"repartir",
  heureAteliers:"8h50", heureReserve:"8h50", heureFin:"12h20",
  responsable:"M. Nollet", signature:"M. Nollet et l'équipe enseignante.", dateCourrier:"", lieuRdv:"auprès de M. Nollet"
};
const S={config:{...DEFAULT_CONFIG},eleves:{},familles:{},ateliers:{},taches:{},appels:{}};
const COLLS=["eleves","familles","ateliers","taches","appels"];
const LS_KEY="po-lkr-2026-v1";
const UI={tab:"prep",slot:"all",q:"",eFilter:"all",eQ:"",planView:"slot",liveSlot:null,liveQ:""};
try{const t=localStorage.getItem("po-tab"); if(t) UI.tab=t;}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9@.]+/g," ").trim();
function tmin(s){if(s==null||s==="")return null;if(typeof s==="number"){ if(s<1) return Math.round(s*1440); return null;}const m=String(s).match(/(\d{1,2})\s*[hH:]\s*(\d{2})?/);if(!m)return null;const h=+m[1],mi=+(m[2]||0);if(h>23||mi>59)return null;return h*60+mi;}
const fmt=m=>m==null?"—":Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");
const isJ=()=>new Date().toLocaleDateString("sv-SE")===S.config.date;
const nowMin=()=>{if(window.__now!=null)return window.__now;const d=new Date();return d.getHours()*60+d.getMinutes();};
const C=()=>S.config;
const fullName=e=>`${(e.nom||"").trim()} ${(e.prenom||"").trim()}`.trim();
const niveau=c=>{const m=String(c||"").match(/[3456]/);return m?+m[0]:9;};

/* ============ Stockage : cet appareil + synchronisation entre appareils (Netlify) ============ */
let MODE="local", LOADED=false;
const ONLINE=(()=>{try{return window.top===window&&(location.protocol==="https:"||location.hostname==="localhost")}catch(e){return false}})();
const SK=LS_KEY+"-sync";
let SY={code:null,etag:null,base:null,cfg:null,unlocked:false,busy:false,timer:null};
try{Object.assign(SY,JSON.parse(localStorage.getItem(SK)||"{}"));}catch(e){}
SY.busy=false;SY.timer=null;
function persistSY(){const o={code:SY.code,cfg:SY.cfg,unlocked:SY.unlocked};try{localStorage.setItem(SK,JSON.stringify({...o,etag:SY.etag,base:SY.base}));}catch(e){try{localStorage.setItem(SK,JSON.stringify(o));}catch(_){}}}
function setSync(kind,msg){const el=$("#sync");if(!el)return;const map={ok:["ok","Synchronisé"],busy:["busy","Synchro…"],off:["","Hors ligne"],err:["err","Erreur de synchro"],local:["local","Enregistré sur cet appareil"],init:["","Connexion…"]};const [c,t]=map[kind]||map.init;el.innerHTML=`<span class="dot ${c}"></span>${esc(t)}`;el.title=msg||t;}
const payload=()=>JSON.parse(JSON.stringify({config:S.config,eleves:S.eleves,familles:S.familles,ateliers:S.ateliers,taches:S.taches,appels:S.appels}));
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);S.config={...DEFAULT_CONFIG,...(o.config||{})};COLLS.forEach(c=>S[c]=o[c]||{});}}catch(e){}}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(payload()));}catch(e){toast("Mémoire de l'appareil pleine : exporte une sauvegarde depuis Documents.");}}
function saveLocal(){writeLocal();scheduleSync();}
function applyRemote(d){const prevIV=typeof inVisitMap==="function"?Object.keys(inVisitMap()):[];const prevPres=new Set(Object.values(S.eleves).filter(e=>e.presence==="present").map(e=>e.id));S.config={...DEFAULT_CONFIG,...(d.config||{})};COLLS.forEach(c=>S[c]=JSON.parse(JSON.stringify(d[c]||{})));writeLocal();if(typeof migrate==="function")migrate();schedule();if(typeof onRemoteDay==="function")setTimeout(()=>onRemoteDay(prevIV,prevPres),50);}
const strip=d=>{const x={...d};delete x.id;return x;};
async function put(c,id,data){S[c][id]={...strip(data),id};schedule();saveLocal();}
async function putMany(c,entries){entries.forEach(([id,d])=>S[c][id]={...strip(d),id});schedule();saveLocal();}
async function delMany(c,ids){if(c==="familles")inscForget(ids.map(id=>S.familles[id]).filter(f=>f&&f.inscId));ids.forEach(id=>delete S[c][id]);schedule();saveLocal();}
const del=(c,id)=>delMany(c,[id]);
async function putConfig(p){S.config={...S.config,...p};schedule();saveLocal();}
function patch(c,id,p){const cur=S[c][id];if(!cur)return;return put(c,id,{...cur,...p});}

/* ateliers et rétroplanning proposés au premier lancement */
const SEED_ATELIERS=[["Accueil","Administration","Entrée"],["Association des parents d'élèves (APE)","Autres","Salle multi"],["EPS et UNSS (atelier escalade)","Sport","Salle multi"],["Les clubs du collège","Club et CDI","Foyer"],["Secrétariat, intendance, vie scolaire, AESH","Administration","Salle multi"],["Visite du restaurant scolaire","Autres","Restaurant scolaire"],["Les langues vivantes","Langue","Info 2"],["Les mathématiques « Kahoot »","Mathématiques","Salle 16"],["Les lettres et le latin","Littéraire","CDI"],["Les besoins éducatifs particuliers","Autres","Salles 17 et 19"],["Les sciences","Sciences","Sciences 3"],["Les arts","Artistique","Arts plastiques"],["Histoire-géographie et outils numériques","Littéraire","Salle 14"],["Chorale","Artistique","Salle musique"]];
const SEED_TACHES=[["Ouvrir l'inscription en ligne des familles (onglet Inscriptions)","2026-10-23"],["Diffuser les flyers avec QR code dans les écoles primaires","2026-10-23"],["Envoyer la fiche atelier aux collègues","2026-10-23"],["Récupérer toutes les fiches ateliers et réserver les salles","2026-11-04"],["Finaliser la liste des élèves volontaires","2026-11-04"],["Mettre à jour le feuillet d'accueil des parents (salles, ateliers)","2026-11-06"],["Clôturer les inscriptions en ligne des familles","2026-11-09"],["Générer le planning et distribuer les convocations élèves","2026-11-10"],["Imprimer les feuillets d'accueil (1 par famille)","2026-11-12"],["Imprimer la liste d'accueil papier de secours et le planning élèves","2026-11-13"],["Préparer la table d'accueil (tablette/PC, affiche QR, feuillets)","2026-11-13"]];
function seedIfEmpty(){if(Object.keys(S.ateliers).length||Object.keys(S.taches).length||Object.keys(S.eleves).length)return;
  SEED_ATELIERS.forEach(([nom,pole,salle],i)=>S.ateliers["a"+String(i).padStart(2,"0")]={id:"a"+String(i).padStart(2,"0"),nom,pole,salle,prof:"",materiel:"",horaires:"Libre d'accès",description:"",eleves:"",ficheRecue:false,ordre:i+1});
  SEED_TACHES.forEach(([label,echeance,fait],i)=>S.taches["t"+String(i).padStart(2,"0")]={id:"t"+String(i).padStart(2,"0"),label,echeance,fait:!!fait,ordre:i+1});writeLocal();}

/* --- synchronisation (fonction Netlify /api/sync + code d'accès) --- */
const isObj=x=>!!x&&typeof x==="object"&&!Array.isArray(x);
const same=(a,b)=>a===b||JSON.stringify(a)===JSON.stringify(b);
function merge3(b,l,r){if(same(l,b))return r;if(same(r,b))return l;if(same(l,r))return l;
  if(isObj(l)&&isObj(r)&&(b===undefined||isObj(b))){const out={};for(const k of new Set([...Object.keys(l),...Object.keys(r)])){const m=merge3(b?b[k]:undefined,l[k],r[k]);if(m!==undefined)out[k]=m;}return out;}
  return l;}
const hasData=d=>!!(d&&(Object.keys(d.eleves||{}).length||Object.keys(d.familles||{}).length));
async function api(op,extra,code){const r=await fetch("/api/sync",{method:"POST",cache:"no-store",headers:{"content-type":"application/json"},body:JSON.stringify({op,code:code??SY.code,...(extra||{})})});
  if(r.status===401){const e=new Error("code");e.code=401;throw e;}let j={};try{j=await r.json();}catch(e){}
  if(r.status===409)return {conflict:true};if(!r.ok)throw new Error(j.error||("Erreur serveur "+r.status));return j;}
function scheduleSync(){if(!ONLINE||!SY.unlocked)return;clearTimeout(SY.timer);SY.timer=setTimeout(syncNow,800);}
async function syncNow(){if(!ONLINE||!SY.unlocked||SY.busy)return;
  if(!navigator.onLine){setSync("off","Hors ligne : les modifications partiront au retour du réseau.");return;}
  SY.busy=true;setSync("busy");
  try{for(let tries=0;tries<6;tries++){const local=payload(),ls=JSON.stringify(local);
      if(!SY.etag){const g=await api("get");
        if(g.empty){const p=await api("put",{data:local});if(p.conflict)continue;SY.etag=p.etag;SY.base=local;break;}
        const merged=hasData(local)?merge3(undefined,g.data,local):g.data;
        if(same(merged,g.data)){applyRemote(g.data);SY.etag=g.etag;SY.base=g.data;break;}
        const p=await api("put",{data:merged,etag:g.etag});if(p.conflict)continue;applyRemote(merged);SY.etag=p.etag;SY.base=merged;break;}
      if(ls!==JSON.stringify(SY.base)){const p=await api("put",{data:local,etag:SY.etag});
        if(p.conflict){const g=await api("get");if(g.empty){SY.etag=null;continue;}applyRemote(merge3(SY.base,payload(),g.data));SY.etag=g.etag;SY.base=g.data;continue;}
        SY.etag=p.etag;SY.base=local;continue;}
      const g=await api("get",{etag:SY.etag});if(g.same)break;if(g.empty){SY.etag=null;SY.base=null;continue;}
      const now=payload();const changed=JSON.stringify(now)!==ls;applyRemote(changed?merge3(SY.base,now,g.data):g.data);SY.etag=g.etag;SY.base=g.data;if(changed)continue;break;}
    persistSY();setSync("ok","Tous les appareils connectés partagent les mêmes données.");
  }catch(e){if(e.code===401){SY.unlocked=false;persistSY();showLock("Le code d'accès a changé. Entre le nouveau code.");}else setSync(navigator.onLine?"err":"off",e.message||"Synchronisation impossible");}
  finally{SY.busy=false;}}
async function sha(t){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function showLock(msg){const el=$("#lock");el.hidden=false;$("#lockBtn").hidden=true;setSync("off");
  el.innerHTML=`<form class="lockbox" id="lockF"><div class="brand"><div class="mark"><small>Invitation</small>Portes<br>ouvertes</div></div><h2>Code d'accès</h2><p class="muted" style="margin:0">Les inscriptions et la liste des élèves sont protégées. Entre le code pour accéder à l'outil.</p>
  <input type="password" id="lockIn" inputmode="numeric" autocomplete="current-password" maxlength="8" aria-label="Code d'accès"><button class="btn pri lg" style="width:100%;justify-content:center">Entrer</button><div class="msg" id="lockMsg">${esc(msg||"")}</div></form>`;
  const i=$("#lockIn");setTimeout(()=>i.focus(),50);$("#lockF").onsubmit=e=>{e.preventDefault();tryUnlock(i.value.trim());};}
async function tryUnlock(code){if(!code)return;const m=$("#lockMsg");m.style.color="var(--muted)";m.textContent="Vérification…";let ok=false,cfg=null,offline=false;
  try{const j=await api("login",null,code);ok=!!j.ok;cfg={salt:j.salt,hash:j.hash};}
  catch(e){if(e.code!==401){offline=true;try{ok=!!(SY.cfg&&SY.cfg.salt)&&(await sha(SY.cfg.salt+":"+code))===SY.cfg.hash;}catch(_){ok=false;}}}
  m.style.color="";if(!ok){m.textContent=offline?"Pas de réseau et code inconnu sur cet appareil.":"Code incorrect.";$("#lockIn").value="";return;}
  SY.code=code;SY.unlocked=true;if(cfg)SY.cfg=cfg;persistSY();$("#lock").hidden=true;$("#lock").innerHTML="";$("#lockBtn").hidden=false;toast(offline?"Déverrouillé (hors ligne)":"Bienvenue !");render();syncNow();setTimeout(()=>{fetchFiches(true);publishPublic();},2500);}
const SEED_ETAGE=["Rez-de-chaussée","Rez-de-chaussée","Rez-de-chaussée","Rez-de-chaussée","Rez-de-chaussée","Rez-de-chaussée","1er étage","1er étage","1er étage","1er étage","1er étage","1er étage","1er étage","1er étage"];
function migrate(){let ch=false;Object.values(S.ateliers).forEach(a=>{const m=/^a(\d\d)$/.exec(a.id);if(m&&a.etage===undefined&&SEED_ETAGE[+m[1]]){a.etage=SEED_ETAGE[+m[1]];if(a.horaires==="Libre d'accès"){a.acces="libre";a.horaires="";}if(a.afficher===undefined)a.afficher=true;ch=true;}});if(ch)saveLocal();}
function initStore(){loadLocal();seedIfEmpty();migrate();LOADED=true;MODE=ONLINE?"sync":"local";render();
  $("#sync").onclick=()=>syncNow();$("#lockBtn").onclick=()=>{SY.unlocked=false;persistSY();showLock();};
  if(!ONLINE){setSync("local");return;}
  setInterval(()=>{if(document.visibilityState==="visible")syncNow();},5000);
  setInterval(()=>{if(document.visibilityState!=="visible")return;if(["ateliers","feuillet","prep"].includes(UI.tab))fetchFiches(false);if(UI.tab==="enquete")fetchResults(false);if(UI.tab==="eleves")fetchVol(false);if(["inscr","plan","prep","accueil"].includes(UI.tab))fetchInsc(false);publishPublic();},30000);
  window.addEventListener("online",syncNow);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncNow();});
  if(!SY.unlocked||!SY.code){showLock();return;}$("#lockBtn").hidden=false;syncNow();setTimeout(()=>{fetchFiches(true);publishPublic();},2500);}
let rT=null;function schedule(){if(rT)return;rT=requestAnimationFrame(()=>{rT=null;render();});}

/* ============ Outils UI ============ */
let toastT=null;function toast(msg,ms=4200){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);}
const dlg=$("#dlg");
function openDlg(title,body,foot,onOpen){dlg.innerHTML=`<div class="dlg-h"><h3>${title}</h3><button class="btn ghost sm" data-close aria-label="Fermer">✕</button></div><div class="dlg-b">${body}</div><div class="dlg-f">${foot||'<button class="btn" data-close>Fermer</button>'}</div>`;dlg.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>dlg.close());if(!dlg.open)dlg.showModal();onOpen&&onOpen(dlg);}
function ask(msg,okLabel="Confirmer",danger=false){return new Promise(res=>{openDlg("Confirmation",`<p style="margin:0">${msg}</p>`,`<button class="btn" data-close>Annuler</button><button class="btn ${danger?'':'pri'}" id="askOk" ${danger?'style="background:var(--bad);border-color:var(--bad);color:var(--card)"':''}>${okLabel}</button>`,d=>{let r=false;d.querySelector("#askOk").onclick=()=>{r=true;d.close();};d.addEventListener("close",()=>res(r),{once:true});});});}
function pickFile(accept,cb){const fi=$("#fileIn");fi.value="";fi.accept=accept;fi.onchange=()=>{const f=fi.files[0];if(f)cb(f);};fi.click();}
async function saveFile(filename,data){const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(filename)?"application/json":"application/octet-stream"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},2000);}

/* ============ Élèves : rôles & horaires ============ */
const isGuide=e=>e.role==="visite"||!!e.aussiVisite;
function famsOf(sid){return Object.values(S.familles).filter(f=>f.statut!=="absent"&&(f.eleve===sid||(!f.eleve&&f.elevePrevu===sid)));}
function visitsOf(sid){const starts=new Map();famsOf(sid).forEach(f=>{const st=f.hDepart?tmin(f.hDepart):tmin(f.slot);if(st==null)return;if(!starts.has(st))starts.set(st,[]);starts.get(st).push(f);});return [...starts.entries()].sort((a,b)=>a[0]-b[0]).map(([t,fs])=>({t,fs}));}
function convoc(e){const c=C();const v=visitsOf(e.id);let h=null,role="",fin=tmin(c.heureFin);
  if(e.role==="atelier"){h=tmin(e.heureConv)??tmin(c.heureAteliers);role=`participera à l'atelier ${e.atelier||""}`.trim();
    if(v.length){h=Math.min(h,v[0].t-c.avance);role+=` et accompagnera ${v.length>1?v.length+" familles (visites à "+v.map(x=>fmt(x.t)).join(" et ")+")":"une famille (visite à "+fmt(v[0].t)+")"}`;}}
  else if(v.length){h=v[0].t-c.avance;role=v.length===1?`accompagnera une famille lors de cette matinée (visite de ${fmt(v[0].t)} à ${fmt(v[0].t+c.dureeVisite)})`:`accompagnera ${v.length} familles lors de cette matinée (visites à ${v.map(x=>fmt(x.t)).join(", ").replace(/, ([^,]*)$/," et $1")})`;}
  else {h=tmin(e.heureConv)??tmin(c.heureReserve);role="sera en réserve pour accompagner les familles selon l'affluence";}
  const own=v.find(x=>x.fs.some(f=>f.fige));if(own){const ff=own.fs.find(f=>f.fige);const lien=ff.lien?` (${ff.lien})`:"";
    role=v.length===1&&e.role!=="atelier"?`accompagnera sa famille${lien} lors de la visite de ${fmt(own.t)}`:role+`, dont la visite de sa famille${lien} à ${fmt(own.t)}`;}
  return {h,role,fin,visites:v,reserve:e.role!=="atelier"&&!v.length};}
/* ============ Genre déduit du prénom (corrigeable à la main) ============ */

function guessGenre(prenom){const p=norm(prenom);if(!p)return "";
  const first=p.split(/[\s-]+/)[0];
  for(const c of [p.replace(/[\s-]+/g,""),first]){if(PRENOMS_MIXTES.has(c))return "";if(G_F.has(c))return "elle";if(G_M.has(c))return "il";}
  // prénom absent de la liste : terminaisons typiques
  if(/(ette|elle|ine|ienne|anne|ane|ina|ia|ie|ee|ah|ha|ya|na|la|ra|sa|ka|ta|da|ma|lyne|line|lys|yse|ise)$/.test(first))return "elle";
  if(/(o|an|en|in|on|el|ien|ard|ert|ric|ck|im|am|is|us|il|our|ou|ad|ed|id|ir|er|or|ey)$/.test(first))return "il";
  return "";}
// genre retenu : la correction manuelle prime, sinon la déduction par le prénom
const genreOf=e=>e.genre||guessGenre(e.prenom);
const genreAuto=e=>!e.genre&&!!guessGenre(e.prenom);
const ilElle=e=>{const g=genreOf(e);return g==="elle"?"Elle":g==="il"?"Il":"Il/Elle";};
const accord=e=>{const g=genreOf(e);return g==="elle"?"e":g==="il"?"":"(e)";};

/* ============ Attribution automatique ============ */
function busyMap(excl){const m={},c=C();Object.values(S.familles).forEach(f=>{if(f.statut==="absent"||(excl&&excl.has(f.id)))return;const sid=f.eleve||f.elevePrevu;if(!sid)return;const st=f.hDepart?tmin(f.hDepart):tmin(f.slot);if(st==null)return;const end=f.hRetour?tmin(f.hRetour):st+c.dureeVisite+c.battement;(m[sid]=m[sid]||[]).push({start:st,end,fam:f.id,fige:!!f.fige});});return m;}
function allocate(fams){
  const c=C(),targets=new Set(fams.map(f=>f.id)),busy=busyMap(targets);
  const studs=Object.values(S.eleves).filter(e=>isGuide(e)&&e.presence!=="absent"&&!e.exclusif);
  const order=fams.slice().sort((a,b)=>(tmin(a.slot)??9999)-(tmin(b.slot)??9999)||norm(a.nom).localeCompare(norm(b.nom)));
  const out=[],missing=[];
  const nVis=s=>new Set((busy[s.id]||[]).map(x=>x.start)).size;
  for(const f of order){const t=tmin(f.slot);if(t==null){missing.push(f);continue;}
    const free=studs.filter(s=>{const iv=busy[s.id]||[];if(nVis(s)>=(s.prioritaire?Math.max(c.maxVisites,+c.maxVisitesPrio||c.maxVisites):c.maxVisites))return false;const d=tmin(s.dispoDes);if(d!=null&&d>t-c.avance)return false;const fi=tmin(s.dispoJusqua);if(fi!=null&&t+c.dureeVisite>fi)return false;
      return iv.every(x=>t>=x.end||t+c.dureeVisite+c.battement<=x.start);});
    let pick=null;
    if(free.length){const lastEnd=s=>Math.max(-1,...(busy[s.id]||[]).filter(x=>x.end<=t).map(x=>x.end));
      free.sort((a,b)=>((b.presence==="present")-(a.presence==="present"))||((b.prioritaire?1:0)-(a.prioritaire?1:0))||((b.confirme!==false)-(a.confirme!==false))||(c.strategie==="reserve"?nVis(b)-nVis(a):nVis(a)-nVis(b))||((a.role==="visite"?0:1)-(b.role==="visite"?0:1))||(nVis(a)&&nVis(b)?lastEnd(b)-lastEnd(a):0)||(niveau(a.classe)-niveau(b.classe))||norm(a.nom).localeCompare(norm(b.nom)));
      pick=free[0];}
    else if(c.maxFamilles>1){const grp=studs.filter(s=>{const at=(busy[s.id]||[]).filter(x=>x.start===t);return at.length>0&&at.length<c.maxFamilles&&!at.some(x=>x.fige);});
      grp.sort((a,b)=>(busy[a.id]||[]).filter(x=>x.start===t).length-(busy[b.id]||[]).filter(x=>x.start===t).length);pick=grp[0]||null;if(pick)f._grouped=true;}
    if(pick){(busy[pick.id]=busy[pick.id]||[]).push({start:t,end:t+c.dureeVisite+c.battement,fam:f.id});out.push([f,pick]);}else missing.push(f);}
  return {out,missing};}
async function applyAlloc(fams,clearFirst){const res=allocate(fams.map(f=>clearFirst?{...f,elevePrevu:null}:f));
  const entries=[];res.out.forEach(([f,s])=>entries.push([f.id,{...S.familles[f.id],elevePrevu:s.id}]));
  res.missing.forEach(f=>{if(clearFirst||S.familles[f.id].elevePrevu)entries.push([f.id,{...S.familles[f.id],elevePrevu:null}]);});
  await putMany("familles",entries);return res;}
/* réattribue les familles à venir d'un élève devenu indisponible */
async function repairFor(sid,reason){const c=C();const now=nowMin();const busyLive=Object.values(S.familles).find(f=>f.eleve===sid&&f.statut==="visite");
  const victims=Object.values(S.familles).filter(f=>f.elevePrevu===sid&&!f.eleve&&(f.statut==="inscrit"||f.statut==="arrive"||!f.statut)&&(reason==="absent"||(!f.fige&&busyLive&&tmin(f.slot)<tmin(busyLive.hDepart)+c.dureeVisite+c.battement)));
  if(!victims.length)return;const lost=victims.filter(f=>f.fige);if(lost.length)await putMany("familles",lost.map(f=>[f.id,{...f,fige:false,figeAvant:sid}]));
  const res=await applyAlloc(victims.map(f=>({...f,fige:false,elevePrevu:null})),true);if(lost.length)setTimeout(()=>toast(`Attention : ${fullName(S.eleves[sid]||{})} devait accompagner sa famille (${lost.map(f=>f.nom).join(", ")}). Un autre élève a été prévu.`,8000),7200);
  const msg=res.out.map(([f,s])=>`${f.nom} (${f.slot}) → ${fullName(S.eleves[s.id])}`).join(" · ");
  toast((msg?"Réattribué : "+msg:"")+(res.missing.length?` ${res.missing.length} famille(s) sans élève disponible.`:""),7000);}

async function mergeFiches(list){const ign=new Set(S.config.fichesIgnorees||[]);const entries=[];let n=Object.keys(S.ateliers).length;
  for(const f of list){if(!f||!f.id||ign.has(f.id))continue;const m=mapFiche(f.data);const a=Object.values(S.ateliers).find(x=>x.ficheId===f.id);
    if(!a){entries.push(["f_"+f.id,{...m,etage:guessEtage(m.salle),afficher:true,ordre:++n,ficheId:f.id,fiche:m,ficheAt:f.updatedAt,changes:{},nouveau:true,ficheRecue:true}]);continue;}
    if((a.ficheAt||"")>=(f.updatedAt||""))continue;
    const na={...a,changes:{...(a.changes||{})}};
    FIELDS.forEach(k=>{const old=a.fiche?a.fiche[k]:undefined,nv=m[k];if(same(nv,old))return;
      const cur=a[k];const empty=cur==null||cur===""||(Array.isArray(cur)&&!cur.length);
      if(same(cur,old)||empty){na[k]=nv;delete na.changes[k];}else if(same(cur,nv))delete na.changes[k];else na.changes[k]=nv;});
    na.fiche=m;na.ficheAt=f.updatedAt;na.ficheRecue=true;entries.push([a.id,na]);}
  if(entries.length){await putMany("ateliers",entries);toast(`${entries.length} fiche(s) atelier reçue(s) ou mise(s) à jour.`);}}

async function mergeInsc(){const ign=S.config.inscIgn||{},up=[],rm=[];let nN=0,nM=0,nA=0;
  for(const r of INSR.list||[]){const id="w_"+r.id,f=S.familles[id],d=r.data||{};if(ign[r.id])continue;
    if(r.annule){if(f&&(!f.statut||f.statut==="inscrit")&&!f.eleve){rm.push(id);nA++;}continue;}
    if(f&&f.inscAt===r.updatedAt)continue;
    const base={nom:String(d.nom||"").toUpperCase(),prenom:titleCase(d.prenom),nb:+d.nb||1,email:d.email||"",slot:d.slot||"",ecole:d.ecole||"",niveau:d.niveau||"",

function readRows(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error("lecture"));r.onload=()=>{try{const wb=XLSX.read(r.result,{type:"array",cellDates:false});
  let best=null;wb.SheetNames.forEach(n=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false});if(!best||rows.length>best.length)best=rows;});res(best||[]);}catch(e){rej(e);}};r.readAsArrayBuffer(file);});}
const YES=v=>{const s=norm(v);if(!s)return false;if(/^(non|no|n|0|false|faux|-|nok)$/.test(s))return false;return /^(oui|yes|y|1|x|ok|true|vrai|si necessaire|v)$/.test(s)||/oui|✓|✔/.test(String(v).toLowerCase())||String(v).trim()==="✓"||String(v).trim()==="✔";};
const TIME_RE=/(\d{1,2})\s*[hH:]\s*(\d{2})?/;
function parseEvento(rows){rows=rows.map(r=>r.map(c=>String(c??"").trim())).filter(r=>r.some(c=>c));if(!rows.length)return {fams:[],slots:[]};
  const W=Math.max(...rows.map(r=>r.length));
  // cas 1 : une colonne « créneau » par ligne
  for(let h=0;h<Math.min(6,rows.length);h++){const hdr=rows[h];const ci=hdr.findIndex(x=>/cr[ée]neau|horaire|heure de visite/i.test(x));if(ci>=0&&rows.slice(h+1).some(r=>TIME_RE.test(r[ci]||""))){return mapRows(rows.slice(h+1),hdr,null,ci);}}
  // cas 2 : une colonne par créneau (format sondage Evento)
  let best=null;
  for(let h=1;h<Math.min(10,rows.length);h++){const labels=[];for(let c=0;c<W;c++)labels.push(rows.slice(0,h).map(r=>r[c]||"").filter(Boolean).join(" "));
    const slotCols=[];labels.forEach((l,c)=>{const m=l.match(TIME_RE);if(m&&c>0)slotCols.push([c,tmin(m[0])]);});
    if(!slotCols.length)continue;const data=rows.slice(h);const score=data.filter(r=>slotCols.some(([c])=>YES(r[c]))).length;
    if(!best||score>best.score)best={h,labels,slotCols,score};}
  if(!best||!best.score)return {fams:[],slots:[],err:"Je n'ai pas trouvé de colonnes de créneaux (ex. « 9h00 ») avec des réponses « Oui »."};
  return mapRows(rows.slice(best.h),best.labels,best.slotCols,null);}
function mapRows(data,hdr,slotCols,slotCol){const H=hdr.map(x=>norm(x));
  const find=re=>H.findIndex((x,i)=>re.test(x)&&!(slotCols||[]).some(([c])=>c===i));
  let iNom=find(/^nom|nom$|name|participant|identit|famille/);let iPre=find(/prenom|first/);let iMail=find(/mail/);let iNb=find(/nombre|personnes|\bnb\b|combien/);let iTel=find(/tel|phone|portable/);
  if(iPre===iNom)iPre=-1;if(iNom<0)iNom=0;
  if(iMail<0){for(let c=0;c<hdr.length;c++){if(data.some(r=>/@/.test(r[c]||""))){iMail=c;break;}}}
  const used=new Set([iNom,iPre,iMail,iNb,iTel,slotCol,...(slotCols||[]).map(x=>x[0])]);
  const fams=[];data.forEach(r=>{let nom=(r[iNom]||"").trim();if(!nom||/^(total|nombre|somme|count)/i.test(nom)||/^\d+$/.test(nom))return;
    let prenom=iPre>=0?(r[iPre]||"").trim():"";if(!prenom&&nom.includes(" ")){const parts=nom.split(/\s+/);const up=parts.filter(p=>p===p.toUpperCase()&&/[A-Z]/.test(p));if(up.length&&up.length<parts.length){prenom=parts.filter(p=>!up.includes(p)).join(" ");nom=up.join(" ");}}
    let slots=[];if(slotCol!=null){const m=(r[slotCol]||"").match(TIME_RE);if(m)slots=[fmt(tmin(m[0]))];}else slots=slotCols.filter(([c])=>YES(r[c])).map(([,t])=>fmt(t));
    const infos=hdr.map((h,c)=>used.has(c)||!r[c]?null:`${h?h+" : ":""}${r[c]}`).filter(Boolean).join(" · ");
    fams.push({nom:nom.toUpperCase(),prenom,email:iMail>=0?r[iMail]||"":"",tel:iTel>=0?r[iTel]||"":"",nb:iNb>=0?(parseInt(r[iNb])||1):1,slot:slots[0]||"",autres:slots.slice(1),infos});});
  const sl=[...new Set(fams.map(f=>f.slot).filter(Boolean))].sort((a,b)=>tmin(a)-tmin(b));return {fams,slots:sl};}
const famKey=f=>norm(f.email)||norm(f.nom+" "+(f.prenom||""));
function previewEvento(rows){const r=parseEvento(rows);if(r.err||!r.fams.length){openDlg("Import impossible",`<div class="alert bad">${esc(r.err||"Aucune famille trouvée dans ce fichier.")}</div><p class="small muted">Vérifie que le fichier contient une ligne par famille et une colonne par créneau (ou une colonne « Créneau »).</p>`);return;}
  const existing={};famList().forEach(f=>{if(f.source!=="manuel")existing[famKey(f)]=f;});const keys=new Set(r.fams.map(famKey));
  const nNew=r.fams.filter(f=>!existing[famKey(f)]).length,nUpd=r.fams.filter(f=>existing[famKey(f)]&&existing[famKey(f)].slot!==f.slot).length;
  const gone=Object.values(existing).filter(f=>!keys.has(famKey(f))&&(f.statut||"inscrit")==="inscrit");const multi=r.fams.filter(f=>f.autres.length);const noS=r.fams.filter(f=>!f.slot);
  openDlg("Vérifier l'import",`<div class="alert ok">${r.fams.length} familles lues · ${nNew} nouvelles · ${nUpd} changements de créneau</div>
  <div class="chips">${r.slots.map(s=>`<span class="chip">${s} <span class="c">${r.fams.filter(f=>f.slot===s).length}</span></span>`).join("")}</div>
  ${multi.length?`<div class="alert">${multi.length} famille(s) ont coché plusieurs créneaux : je garde le premier (${esc(multi.slice(0,4).map(f=>f.nom).join(", "))}${multi.length>4?"…":""}).</div>`:""}
  ${noS.length?`<div class="alert">${noS.length} ligne(s) sans créneau coché seront importées « sans créneau ».</div>`:""}
  ${gone.length?`<label class="row small"><input type="checkbox" id="rmGone"> Retirer ${gone.length} famille(s) absente(s) de ce nouvel export (désinscrites) : ${esc(gone.slice(0,5).map(f=>f.nom).join(", "))}${gone.length>5?"…":""}</label>`:""}
  ${(C().slots.join()!==[...new Set([...C().slots,...r.slots])].sort((a,b)=>tmin(a)-tmin(b)).join())?`<p class="small muted" style="margin:0">De nouveaux créneaux seront ajoutés aux réglages.</p>`:""}
  <div class="tbl-wrap" style="max-height:240px"><table><thead><tr><th>Famille</th><th>Créneau</th><th>Pers.</th><th>E-mail</th></tr></thead><tbody>${r.fams.slice(0,60).map(f=>`<tr><td>${esc(f.nom)} ${esc(f.prenom)}</td><td class="t">${esc(f.slot||"—")}</td><td>${f.nb}</td><td class="small">${esc(f.email)}</td></tr>`).join("")}</tbody></table></div>`,
  `<button class="btn" data-close>Annuler</button><button class="btn pri" id="impOk">Importer ${r.fams.length} familles</button>`,d=>{d.querySelector("#impOk").onclick=async()=>{
    const rm=d.querySelector("#rmGone")&&d.querySelector("#rmGone").checked;d.close();const entries=[];
    r.fams.forEach(f=>{const ex=existing[famKey(f)];const base={nom:f.nom,prenom:f.prenom,email:f.email,tel:f.tel,nb:f.nb,slot:f.slot,infos:f.infos,source:"evento"};
      if(ex){const nf={...ex,...base};if(ex.slot!==f.slot&&!ex.eleve)nf.elevePrevu=null;entries.push([ex.id,nf]);}else entries.push([uid(),{...base,statut:"inscrit",elevePrevu:null}]);});
    const newSlots=[...new Set([...C().slots,...r.slots])].sort((a,b)=>tmin(a)-tmin(b));if(newSlots.join()!==C().slots.join())await putConfig({slots:newSlots});
    await putMany("familles",entries);if(rm)await delMany("familles",gone.map(f=>f.id));toast(`${entries.length} familles importées. Pense à compléter le planning.`);};});}

function optStudents(f,cur){const c=C(),t=tmin(f.slot),busy=busyMap(new Set([f.id]));return Object.values(S.eleves).filter(e=>isGuide(e)&&e.presence!=="absent").map(e=>{const iv=busy[e.id]||[];const ok=iv.every(x=>t>=x.end||t+c.dureeVisite+c.battement<=x.start);const same=iv.filter(x=>x.start===t).length;return {e,ok,same,n:new Set(iv.map(x=>x.start)).size};})

const ecranOn=()=>C().ecranActif!==false;

const callOf=sid=>{const a=S.appels[sid];return a&&a.etat!=="fini"?a:null;};
async function callStudent(fid,sid){const f=S.familles[fid];const t=fmt(nowMin());

async function clearCalls(pred){const ids=Object.values(S.appels).filter(a=>a&&pred(a)).map(a=>a.id);if(ids.length)await delMany("appels",ids);}
const callPill=sid=>{const a=callOf(sid);if(!a)return "";const m=nowMin()-(tmin(a.at)??nowMin());return a.etat==="vient"?`<span class="pill ok">arrive (« J'arrive » à ${esc(a.ackAt||"")})</span>`:`<span class="pill ${m>=3?"bad":"warn"}">appelé${m>0?` il y a ${m} min`:""}</span>`;};
/* changements venus de l'écran (pointage d'arrivée, retour de visite) */
function onRemoteDay(prevIV,prevPres){if(UI.tab!=="accueil")return;const iv=inVisitMap();

  if(back.length){const sid=back[0];if(waitingFams().length&&!dlg.open)proposeFamily(sid,`${fullName(S.eleves[sid])} est revenu(e) de visite (pointé sur l'écran).`);else toast(`${back.map(id=>titleCase(S.eleves[id].prenom)).join(", ")} de retour de visite (écran).`);}}
function ecranCard(){const calls=Object.values(S.appels).filter(a=>a&&a.etat!=="fini");

function stuState(sid,iv){const e=S.eleves[sid];const c=C(),now=nowMin();if(!e)return {k:"none",label:"aucun élève prévu",cls:"bad"};iv=iv||inVisitMap();

function freeGuides(excludeFid){const c=C(),now=nowMin(),iv=inVisitMap(),fams=famList();
  return Object.values(S.eleves).filter(e=>isGuide(e)&&e.presence==="present"&&!iv[e.id]&&!e.exclusif).map(e=>{

    return {e,nx,done:fams.filter(f=>f.eleve===e.id).length};})
    .sort((a,b)=>((a.nx?1:0)-(b.nx?1:0))||((b.e.prioritaire?1:0)-(a.e.prioritaire?1:0))||(a.done-b.done)||niveau(a.e.classe)-niveau(b.e.classe)||norm(a.e.nom).localeCompare(norm(b.e.nom)));}
const waitingFams=()=>famList().filter(f=>f.statut==="arrive"&&!f.eleve).sort((a,b)=>(tmin(a.hArrivee)??9999)-(tmin(b.hArrivee)??9999));

function departRows(){const now=nowMin(),iv=inVisitMap(),d=delaiRetard();

    const t=tmin(f.slot),arr=f.statut==="arrive",lateF=!arr&&now>t+d;const sid=f.attend||f.elevePrevu;const s=sid?stuState(sid,iv):stuState(null,iv);
    let famLab=arr?`arrivée ${f.hArrivee||""}`:lateF?`pas arrivée (+${now-t} min)`:now>=t?"attendue":`attendue à ${f.slot}`;const famCls=arr?"ok":lateF?"bad":"";
    let actions=[],level=0;
    if(arr){if(s.k==="libre"){if(ecranOn()&&!callOf(sid))actions.push(`<button class="btn sm pri" data-call="${f.id}|${sid}">Appeler ${esc(prenomOf(sid))}</button>`);actions.push(`<button class="btn sm ok" data-go2="${f.id}|${sid}">Partir avec ${esc(prenomOf(sid))}</button>`);}
      else{level=2;const best=freeGuides(f.id)[0];if(best){if(ecranOn()&&!callOf(best.e.id))actions.push(`<button class="btn sm pri" data-call="${f.id}|${best.e.id}">Appeler ${esc(titleCase(best.e.prenom))}</button>`);actions.push(`<button class="btn sm ${ecranOn()?"ok":"pri"}" data-go2="${f.id}|${best.e.id}">Partir avec ${esc(titleCase(best.e.prenom))}</button>`);}
        if(s.k==="visite"&&!f.attend)actions.push(`<button class="btn sm" data-wait="${f.id}|${sid}">Attendre ${esc(prenomOf(sid))}</button>`);
        if(!best&&s.k!=="visite")actions.push(`<button class="btn sm" data-arr="${f.id}">Voir les solutions</button>`);}}
    else{if(lateF){level=1;actions.push(`<button class="btn sm" data-fabs="${f.id}">Famille absente</button>`);}
      const pb=s.k==="absent"||s.k==="none"||(s.k==="attendu"&&s.cls==="bad")||(s.k==="visite"&&Math.max(s.back,now)>t+3);
      if(pb){level=Math.max(level,s.k==="visite"?1:2);if(freeGuides(f.id).length)actions.push(`<button class="btn sm" data-repl="${f.id}">Remplacer l'élève</button>`);}
      actions.push(`<button class="btn sm pri" data-arr="${f.id}">Arrivée</button>`);}
    return {f,t,famLab,famCls,sid,s,actions,level};});}

function famCard(f){const st=f.statut||"inscrit";const now=nowMin();const plan=f.elevePrevu&&S.eleves[f.elevePrevu];let right="",meta=[`<span class="t">${esc(f.slot||"—")}</span>`,`${esc(f.nb||1)} pers.`];

    if(tmin(f.slot)!=null&&now>tmin(f.slot)+delaiRetard())meta.push(`<span class="pill bad">en retard (+${now-tmin(f.slot)} min)</span>`);
    right=`<button class="btn pri" data-arr="${f.id}">Arrivée</button><button class="btn sm ghost" data-famabs="${f.id}" title="Marquer absente">Absente</button>`;}
  else if(st==="arrive"){meta.push(`arrivée à ${esc(f.hArrivee||"")}`);if(f.attend)meta.push(`attend <b>${esc(fullName(S.eleves[f.attend]||{}))}</b> <span class="pill warn">${esc(stuState(f.attend).k==="visite"?"en visite":stuState(f.attend).label)}</span>`);right=`<button class="btn pri" data-arr="${f.id}">Attribuer un élève</button>`;}
  else if(st==="visite"){meta.push(`avec <b>${esc(fullName(S.eleves[f.eleve]||{}))}</b> depuis ${esc(f.hDepart||"")}`);right=`<button class="btn sm ok" data-famback="${f.id}">Visite terminée</button>`;}
  else if(st==="fini"){meta.push(`visite avec ${esc(fullName(S.eleves[f.eleve]||{}))} · ${esc(f.hDepart||"")}–${esc(f.hRetour||"")}`);}
  else if(st==="absent"){right=`<button class="btn sm ghost" data-famabs="${f.id}">Annuler absence</button>`;}
  return `<div class="fam st-${st}"><div style="min-width:0"><div class="who">${esc(f.nom)} ${esc(f.prenom||"")} ${stPill(f)}${f.source==="sur place"?' <span class="pill acc">sans inscription</span>':""}</div><div class="meta">${meta.join("<span>·</span>")}${f.infos?`<span>·</span><span>${esc(f.infos)}</span>`:""}</div></div><div class="row" style="justify-content:flex-end">${right}</div></div>`;}
function arrivalDlg(fid){const f=S.familles[fid];const c=C(),now=nowMin();const fams=famList();const iv=inVisitMap();

  const alts=freeGuides(f.id).filter(x=>x.e.id!==planId);

  const altBtn=(x,i)=>(ecranOn()?`<div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm pri" data-calld="${x.e.id}" style="flex:none">Appeler</button>`:"")+`<button class="btn" style="justify-content:space-between;text-align:left;flex:1;min-width:0" data-go="${x.e.id}"><span><b>${esc(fullName(x.e))}</b> <span class="muted small">${esc(x.e.classe)}</span>${i===0&&!x.nx?' <span class="pill ok">conseillé</span>':""}</span><span class="small">${x.nx?`<span class="pill warn">${x.nx.f.fige?"réservé à sa famille":"prévu"} à ${fmt(x.nx.t)} avec ${esc(x.nx.f.nom)}</span>`:`<span class="muted">${x.done} visite(s) faite(s)</span>`}</span></button>`+(ecranOn()?"</div>":"");

  openDlg(`Accueil : ${esc(f.nom)} ${esc(f.prenom||"")}`,`<div class="row"><span class="pill">${esc(f.slot||"sans créneau")}</span><span class="pill">${esc(f.nb||1)} pers.</span>${late>10?`<span class="pill warn">${late} min de retard</span>`:late<-10?`<span class="pill info">${-late} min d'avance</span>`:""}</div>

  ${recent.length&&!alts.length?`<div class="sec-t" style="margin:0">Rejoindre une visite qui vient de partir</div><div style="display:grid;gap:6px">${recent.map(x=>`<button class="btn" data-join="${x.sid}">${esc(fullName(S.eleves[x.sid]||{}))} · partie à ${esc(x.fs[0].hDepart)} avec ${esc(x.fs.map(y=>y.nom).join(" + "))}</button>`).join("")}</div>`:""}`,
  `<button class="btn" data-close>Fermer</button>${f.statut!=="arrive"?'<button class="btn" id="waitB">Arrivée, en attente d\'un élève</button>':""}`,d=>{
    d.querySelectorAll("[data-go]").forEach(b=>b.onclick=async()=>{d.close();await goVisit(f.id,b.dataset.go);});
    d.querySelectorAll("[data-waitd]").forEach(b=>b.onclick=async()=>{d.close();await waitFor(f.id,b.dataset.waitd);});
    d.querySelectorAll("[data-calld]").forEach(b=>b.onclick=async()=>{d.close();await callStudent(f.id,b.dataset.calld);});
    d.querySelectorAll("[data-markabs]").forEach(b=>b.onclick=async()=>{d.close();await patch("eleves",b.dataset.markabs,{presence:"absent"});await repairFor(b.dataset.markabs,"absent");arrivalDlg(f.id);});
    d.querySelectorAll("[data-join]").forEach(b=>b.onclick=async()=>{d.close();const ref=fams.find(x=>x.statut==="visite"&&x.eleve===b.dataset.join);await patch("familles",f.id,{statut:"visite",eleve:b.dataset.join,attend:null,hArrivee:f.hArrivee||fmt(nowMin()),hDepart:ref.hDepart});toast(`${f.nom} rejoint la visite de ${fullName(S.eleves[b.dataset.join])}.`);});
    const w=d.querySelector("#waitB");if(w)w.onclick=()=>{d.close();patch("familles",f.id,{statut:"arrive",hArrivee:fmt(nowMin())});};});}
async function goVisit(fid,sid){const f=S.familles[fid];const t=fmt(nowMin());await clearCalls(a=>a.eleve===sid||a.famille===fid);await patch("familles",fid,{statut:"visite",eleve:sid,attend:null,hArrivee:f.hArrivee||t,hDepart:t});
  toast(`${f.nom} part en visite avec ${fullName(S.eleves[sid])}.`);await repairFor(sid,"busy");}
/* cas 3 : la famille attend son élève, encore en visite ; il lui sera proposé dès son retour */
async function waitFor(fid,sid){const f=S.familles[fid];await patch("familles",fid,{statut:"arrive",attend:sid,hArrivee:f.hArrivee||fmt(nowMin())});toast(`${f.nom} attend ${prenomOf(sid)} : la famille lui sera proposée dès son retour.`);}
/* cas 2 (anticipé) : l'élève prévu est absent, pas arrivé ou en retard de visite → un élève libre prend la famille */
async function replacePlan(fid){const f=S.familles[fid];if(f.fige&&!(await ask(`${esc(fullName(S.eleves[f.elevePrevu]||{}))} devait accompagner sa famille${f.lien?" ("+esc(f.lien)+")":""}. Confier quand même ${esc(f.nom)} à un autre élève ?`,"Remplacer")))return;if(f.fige)await patch("familles",fid,{fige:false,figeAvant:f.elevePrevu});const L=freeGuides(fid).filter(x=>x.e.id!==f.elevePrevu);const best=L.find(x=>!x.nx)||L[0];
  if(!best)return toast("Aucun élève libre pour l'instant. La famille sera accueillie à son arrivée par le premier élève disponible.");
  const old=f.elevePrevu;await patch("familles",fid,{elevePrevu:best.e.id,attend:null});toast(`${titleCase(best.e.prenom)} accompagnera ${f.nom} (${f.slot})${old?` à la place de ${prenomOf(old)}`:""}.`,6000);}
/* cas 1 : la famille ne vient pas → l'élève prévu est libéré, et on lui propose une famille qui attend */

function qrCanvas(text,cell){const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),m=4,cv=document.createElement("canvas");cv.width=cv.height=(n+m*2)*cell;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+m)*cell,(r+m)*cell,cell,cell);return cv;}
function drawQR(){const b=$("#qrBox");if(!b||typeof qrcode==="undefined")return;try{const cv=qrCanvas(inscUrl(),6);b.innerHTML="";b.appendChild(cv);}catch(e){b.textContent="Lien trop long pour un QR code.";}}

const P=s=>String(s??"").replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/–|—/g,"-").replace(/…/g,"...").replace(/ | /g," ");
function newPdf(o){if(!window.jspdf){toast("Le générateur PDF n'est pas chargé, recharge la page.");return null;}return new window.jspdf.jsPDF({unit:"mm",format:"a4",...(o||{})});}

function pdfConvocations(){const c=C();const el=Object.values(S.eleves).filter(e=>e.presence!=="absent").sort((a,b)=>niveau(a.classe)-niveau(b.classe)||String(a.classe).localeCompare(String(b.classe))||norm(a.nom).localeCompare(norm(b.nom)));if(!el.length)return toast("Aucun élève à convoquer.");
  const doc=newPdf();if(!doc)return;const dc=c.dateCourrier||new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});

function tablePdf(doc,title,sub,cols,rows,opt={}){let y=18;const W=opt.landscape?297:210,H=opt.landscape?210:297;const head=()=>{doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text(P(title),12,y);doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(110);doc.text(P(sub),12,y+5.5);doc.setTextColor(0);y+=12;hdr();};
  const hdr=()=>{doc.setFillColor(238,232,244);doc.rect(12,y-4.5,W-24,7,"F");doc.setFont("helvetica","bold");doc.setFontSize(9);let x=12;cols.forEach(cl=>{doc.text(P(cl.t),x+1.5,y);x+=cl.w;});y+=6;doc.setFont("helvetica","normal");};
  head();rows.forEach(r=>{if(r.section){if(y>H-22){doc.addPage();y=18;hdr();}doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text(P(r.section),12,y+1);doc.setFont("helvetica","normal");y+=7;return;}
    doc.setFontSize(9.5);const cells=cols.map((cl,i)=>doc.splitTextToSize(P(r[i]??""),cl.w-3));const h=Math.max(...cells.map(c=>c.length))*4.3+2.2;if(y+h>H-12){doc.addPage();y=18;hdr();}
    let x=12;cells.forEach((c,i)=>{if(cols[i].box){doc.rect(x+2,y-3.2,3.6,3.6);}else doc.text(c,x+1.5,y);x+=cols[i].w;});doc.setDrawColor(220);doc.line(12,y+h-3.6,W-12,y+h-3.6);y+=h;});}

function pdfAffiche(){const c=C();const doc=newPdf();if(!doc)return;const url=inscUrl();const cv=qrCanvas(url,14);const img=cv.toDataURL("image/png");
