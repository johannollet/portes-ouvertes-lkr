<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Votre avis · Portes ouvertes</title>
<meta name="theme-color" content="#1d1530">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
.eq{max-width:640px;margin:0 auto;display:grid;gap:14px}
.eq h2{font-size:28px}
.eq-q{display:grid;gap:10px}
.eq-q > b{font-size:17px;line-height:1.3}
.eq-q .opt{font-weight:400;color:var(--muted);font-size:13px}
.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.face{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 2px 6px;cursor:pointer;display:grid;justify-items:center;gap:2px;color:var(--muted);font:600 11px var(--f-body)}
.face span{font-size:30px;line-height:1.1;filter:grayscale(.6);transition:filter .15s,transform .15s}
.face[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card));color:var(--ink)}
.face[aria-pressed="true"] span{filter:none;transform:scale(1.12)}
.eq .chip{font-size:15px;padding:9px 14px}
.eq textarea{width:100%;font:16px var(--f-body);min-height:90px}
.eq-send{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.eq-done{text-align:center;display:grid;gap:12px;justify-items:center;padding:30px 16px}
.eq-done .pf-check{width:80px;height:80px;font-size:42px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="mark"><small>Invitation</small>Portes<br>ouvertes</div>
  <div><h1 id="hTitle">Collège Lili Keller Rosenberg</h1><p id="hSub">Votre avis compte</p></div></div>
</div></header>
<main><div class="wrap" id="view"><div class="empty"><b>Chargement…</b></div></div></main>
<script>
/* Enquête de satisfaction des familles : page publique et anonyme.
   Elle ne lit que l'enquête publiée par l'organisateur et envoie les réponses à /api/enquete.
   « enquete.html?borne » : mode tablette d'accueil, la page se remet à zéro après chaque réponse. */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BORNE=new URLSearchParams(location.search).has("borne");
const FACES=[["😞","Déçu"],["🙁","Bof"],["😐","Correct"],["🙂","Bien"],["😍","Super"]];
let E=null,INFO=null,A={},sent=false,busy=false,err="";
const api=async(op,extra)=>{const r=await fetch("/api/enquete",{method:"POST",cache:"no-store",headers:{"content-type":"application/json"},body:JSON.stringify({op,...(extra||{})})});let j={};try{j=await r.json();}catch(e){}if(!r.ok)throw new Error(j.error||("Erreur "+r.status));return j;};
async function init(){try{const j=await api("public");E=j.enquete;INFO=j.info;}catch(e){err="Impossible de charger l'enquête. Vérifiez votre connexion.";}
  if(INFO){$("#hTitle").textContent=INFO.college||"Portes ouvertes";$("#hSub").textContent=`Portes ouvertes du ${INFO.dateTexte||""}`;}
  if(!BORNE){try{if(localStorage.getItem("po-enquete-faite")==="1")sent=true;}catch(e){}}
  render();}
function render(){const v=$("#view");
  if(err&&!E){v.innerHTML=`<div class="eq"><div class="alert bad">${esc(err)}</div><button class="btn" onclick="location.reload()">Réessayer</button></div>`;return;}
  if(!E||!E.ouverte||!E.questions.length){v.innerHTML=`<div class="eq"><div class="card eq-done"><h2>L'enquête n'est pas ouverte</h2><p class="muted">Merci de votre visite au collège !</p></div></div>`;return;}
  if(sent){v.innerHTML=`<div class="eq"><div class="card eq-done"><div class="pf-check">✓</div><h2>Merci !</h2><p>${esc(E.merci||"Merci pour votre réponse et à bientôt au collège.")}</p>${BORNE?`<p class="small muted" id="cd">Nouvelle réponse dans 6 s…</p>`:`<button class="btn sm ghost" id="again">Répondre à nouveau (autre famille)</button>`}</div></div>`;
    if(BORNE){let n=6;const t=setInterval(()=>{n--;const c=$("#cd");if(c)c.textContent=`Nouvelle réponse dans ${n} s…`;if(n<=0){clearInterval(t);A={};sent=false;render();window.scrollTo({top:0});}},1000);}
    else $("#again").onclick=()=>{A={};sent=false;try{localStorage.removeItem("po-enquete-faite");}catch(e){}render();};return;}
  v.innerHTML=`<form class="eq" id="eqF" novalidate><div><h2>${esc(E.titre||"Votre avis")}</h2>${E.intro?`<p class="lead" style="margin:4px 0 0">${esc(E.intro)}</p>`:""}</div>
  ${E.questions.map(q=>`<section class="card eq-q" data-q="${esc(q.id)}"><b>${esc(q.label)}${q.obligatoire?" *":` <span class="opt">(facultatif)</span>`}</b>${field(q)}</section>`).join("")}
  <div class="hp" aria-hidden="true"><label>Site <input type="text" id="site" tabindex="-1" autocomplete="off"></label></div>
  <div class="eq-send"><button class="btn pri lg" id="send" ${busy?"disabled":""}>${busy?"Envoi…":"Envoyer mon avis"}</button><span id="msg" class="small" style="color:var(--bad)">${esc(err)}</span></div>
  <p class="small muted" style="margin:0">Réponse anonyme. Moins d'une minute.</p></form>`;
  v.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>{A[b.dataset.qid]=+b.dataset.note;keepScroll(render);});
  v.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{const q=E.questions.find(x=>x.id===b.dataset.qid);const val=b.dataset.ch;
    if(q.type==="multi"){const cur=new Set(A[q.id]||[]);cur.has(val)?cur.delete(val):cur.add(val);A[q.id]=[...cur];}else A[q.id]=A[q.id]===val?undefined:val;keepScroll(render);});
  v.querySelectorAll("textarea[data-qid]").forEach(t=>t.oninput=()=>{A[t.dataset.qid]=t.value;});
  $("#eqF").onsubmit=async e=>{e.preventDefault();const miss=E.questions.filter(q=>q.obligatoire&&(A[q.id]==null||A[q.id]===""||(Array.isArray(A[q.id])&&!A[q.id].length)));
    if(miss.length){err="Merci de répondre à : "+miss.map(q=>q.label).join(" ; ");render();const el=document.querySelector(`[data-q="${miss[0].id}"]`);el&&el.scrollIntoView({behavior:"smooth",block:"center"});return;}
    busy=true;err="";render();try{await api("answer",{answers:A,site:$("#site")?$("#site").value:""});sent=true;A={};if(!BORNE){try{localStorage.setItem("po-enquete-faite","1");}catch(e){}}}catch(er){err=er.message||"Envoi impossible, réessayez.";}
    busy=false;render();window.scrollTo({top:0});};}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo({top:y});}
function field(q){const a=A[q.id];
  if(q.type==="note")return `<div class="faces">${FACES.map(([f,l],i)=>`<button type="button" class="face" data-qid="${esc(q.id)}" data-note="${i+1}" aria-pressed="${a===i+1}" aria-label="${l}"><span>${f}</span>${l}</button>`).join("")}</div>`;
  if(q.type==="choix"||q.type==="multi")return `<div class="chips">${q.options.map(o=>`<button type="button" class="chip" data-qid="${esc(q.id)}" data-ch="${esc(o)}" aria-pressed="${q.type==="multi"?(a||[]).includes(o):a===o}">${esc(o)}</button>`).join("")}</div>${q.type==="multi"?'<span class="small muted">Plusieurs réponses possibles</span>':""}`;
  return `<textarea data-qid="${esc(q.id)}" maxlength="800" placeholder="Votre réponse…">${esc(a||"")}</textarea>`;}
init();
</script>
</body></html>
